    line: { en: "Two projects taken to Game Jam Plus with a pitch and a playable build, and Prismonaut carried through the program's incubation stage on the way to a Steam build.", es: "Dos proyectos llevados a Game Jam Plus con pitch y build jugable, y Prismonaut llevado por la etapa de incubación del programa camino a una build de Steam." }
  }
];

/* El orden de la v4: primero lo que construyó, después con qué. La trayectoria
   va detrás porque a esta altura ya se ganó la lectura. */
var SECTIONS = [
  { key: "projects", el: "sec-projects", label: "navProjects" },
  { key: "timeline", el: "sec-timeline", label: "navTimeline" },
  { key: "contact",  el: "sec-contact",  label: "navContact" }
];

/* ---------- fecha de actualizacion --------------------------------------- */
/* Manual a proposito: si saliera del ultimo commit, cualquier cambio de CSS
   resetearia el reloj y nunca se veria vieja. Se actualiza al tocar contenido. */
const LAST_UPDATE = "2026-10-14";

function lastUpdatedText(lang) {
  var p = LAST_UPDATE.split("-");
  /* por partes = hora local. new Date("2026-08-21") se parsea como UTC y en
     UTC-5 devolveria el dia anterior. */
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  try {
    return new Intl.DateTimeFormat(lang === "es" ? "es-PE" : "en-US",
      { day: "numeric", month: "long", year: "numeric" }).format(d);
  } catch (err) { return LAST_UPDATE; }
}

/* ---------- estado -------------------------------------------------------- */
/* role: el perfil del selector (td | ud). media: qué pieza muestra el inspector. */
var state = { lang: "en", active: "projects", open: null, playing: false, role: "td", media: 0, filter: "all" };
/* Que tarjeta esta pintada ahora mismo en el DOM del inspector. Sirve para
   refrescar en sitio en vez de reconstruir, que mataria el iframe del video. */
var modalShown = "";

try {
  var savedLang = localStorage.getItem("arzpal-lang");
  if (savedLang === "en" || savedLang === "es") state.lang = savedLang;
} catch (err) {}

/* ---------- utilidades ---------------------------------------------------- */
function $(id) { return document.getElementById(id); }

function pick(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "string") return v;
  return v[state.lang] !== undefined ? v[state.lang] : (v.en || "");
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function firstSentence(s) {
  s = String(s || "");
  var m = s.match(/^[\s\S]*?[.!?](\s|$)/);
  return m ? m[0].trim() : s;
}


function thumbUrl(item) {
  if (item.cover) return item.cover;
  /* El póster del loop es un fotograma de juego en plena acción y a 16:9; la
     miniatura de YouTube viene a 4:3 con franjas negras. */
  if (item.loop) return item.loop.replace(/\.mp4$/, ".jpg");
  if (item.youtubeId) return "https://i.ytimg.com/vi/" + item.youtubeId + "/hqdefault.jpg";
  return null;
}

function bigUrl(item) {
  if (item.image) return item.image;
  if (item.cover) return item.cover;
  if (item.loop) return item.loop.replace(/\.mp4$/, ".jpg");
  if (item.youtubeId) return "https://i.ytimg.com/vi/" + item.youtubeId + "/maxresdefault.jpg";
  return null;
}

function cssUrl(u) { return "url(&#39;" + esc(u) + "&#39;)"; }

/* Movimiento reducido: ningún video arranca solo, se queda el póster. */
var REDUCED = false;
try { REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (err) {}

/* v5: las fichas se buscan por id, no por posición. FEAT y el archivo las
   nombran así; data-g/data-i siguen existiendo porque el inspector y HANDS
   trabajan por grupo e índice. */
function findItem(id) {
  for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return { item: PROJECTS[i], g: "p", i: i };
  for (var j = 0; j < TOOLS.length; j++) if (TOOLS[j].id === id) return { item: TOOLS[j], g: "t", i: j };
  return null;
}
function figNumber(g, i) { return g === "t" ? PROJECTS.length + i + 1 : i + 1; }

/* =========================================================================
   LA HOJA. Una sola función para proyectos y herramientas: la diferencia
   está en los datos, no en dos plantillas que después hay que mantener a la par.
   ========================================================================= */

/* Los giros: cuatro valores que se repiten en ciclo. Uniforme se lee como
   componente de UI; aleatorio se lee como error. Cuatro es suficiente para
   que la grilla respire y no se note el patrón. */
const ROTS = ["-.6deg", ".45deg", "-.35deg", ".7deg"];

function accVars(item, i) {
  var a = item.acc || "space";
  return "--kc:var(--k-" + a + ");--ki:var(--ki-" + a + ");--rot:" + ROTS[(i || 0) % 4];
}

/* Las etiquetas del diagrama no se filtran NUNCA: el filtro de tiza se come
   el texto. Van encima, con el papel como contorno para abrir hueco en el trazo. */
function figLabels(list, size, extra) {
  if (!list || !list.length) return "";
  return '<g style="fill:var(--graphite);stroke:var(--paper-2)" font-family="\'Martian Mono\',monospace"'
    + ' paint-order="stroke" stroke-width="3.6" stroke-linejoin="round" font-size="' + size + '"'
    + ' letter-spacing=".3"' + (extra || "") + '>'
    + list.map(function (l) {
        return '<text x="' + l[0] + '" y="' + l[1] + '"'
          + (l[3] ? ' text-anchor="' + l[3] + '"' : ' text-anchor="middle"')
          + '>' + esc(pick(l[2])) + '</text>';
      }).join("")
    + '</g>';
}

/* El diagrama, en dos pasadas sobre la misma geometría: primero el núcleo
   nítido y fino, y encima la capa gruesa con la textura de tiza. Dibujarlo una
   sola vez con el filtro le abre agujeros al trazo entero; ése fue el error de
   las primeras pruebas. El temblor va topado por debajo del grosor. */
function figSvg(key) {
  var d = DIAGRAMS[key];
  if (!d) return "";
  var geo = '<use href="#' + d.g + '"/><use href="#' + d.g + 'Dense"/>';
  /* El grosor viaja como custom property, no como atributo: stroke-width NO
     cruza al contenido clonado por <use>, pero las variables CSS sí — que es
     justo cómo le llega también el color de tiza del proyecto. */
  var h = '<svg class="fig" viewBox="0 0 320 180" role="img" aria-label="' + esc(d.aria) + '">'
        + '<g opacity=".36" style="--sw:2.96">' + geo + '</g>'
        + '<g opacity=".92" style="--sw:4" filter="url(#chalk)">' + geo + '</g>'
        + figLabels(d.nodes, "10.5");
  /* El pie va un punto más chico que las etiquetas: es aclaración, no rótulo. */
  if (d.note) h += figLabels([[d.note.x, d.note.y, d.note, d.note.anchor || "middle"]], "9.5", ' opacity=".85"');
  if (d.hand) {
    h += '<g style="fill:var(--graphite);stroke:var(--paper-2)" font-family="Caveat,cursive"'
       + ' paint-order="stroke" stroke-width="3.6" stroke-linejoin="round" font-size="17"'
       + ' opacity=".82" text-anchor="' + (d.hand.anchor || "end") + '"'
       + (d.hand.rot ? ' transform="rotate(' + d.hand.rot + ')"' : '') + '>'
       + pick(d.hand.lines).map(function (t, i) {
           return '<text x="' + d.hand.x + '" y="' + (d.hand.y + i * 15) + '">' + esc(t) + '</text>';
         }).join("")
       + '</g>';
  }
  return h + '</svg>';
}

/* La figura de la hoja. v5: el MATERIAL manda (crítica del 13-oct, P1: en
   Tatemis el diagrama le ganaba al video). Primero la portada o el póster del
   loop; el diagrama en tiza solo para lo que no tiene nada que mostrar, porque
   no hay material o porque hay NDA. Cuando hay las dos cosas, el diagrama se
   muda al bloque "How it works" del inspector. */
function figureFor(item) {
  var url = thumbUrl(item);
  if (url) return '<img class="figimg" src="' + esc(url) + '" alt="" loading="lazy" decoding="async">';
  if (item.diag && DIAGRAMS[item.diag]) return figSvg(item.diag);
  /* Hueco honesto: dice qué archivo falta en vez de fingir que está. */
  return '<div class="figgap"><i></i><span>' + esc(coverPath(item)) + '</span></div>';
}

function coverPath(item) {
  return "assets/" + (item.acc || "cover") + "-cover.png";
}

function pad2(n) { return n < 10 ? "0" + n : String(n); }

/* El pie de figura dice qué se está viendo y qué pasa al abrir la hoja. */
function figCaption(item, n) {
  var t = COPY[state.lang];
  var d = item.diag && DIAGRAMS[item.diag];
  var body = thumbUrl(item)
    ? (item.loop || item.youtubeId ? (item.capKind === "trailer" ? t.capTrailer : t.capVideo) : t.capCover)
    : d ? pick(d.cap) : t.capCover;
  return "Fig. " + pad2(n) + " · " + body;
}

/* La pieza de la hoja: el loop si lo hay, la figura si no. La grande arranca
   sola (data-auto, y solo mientras se ve); las chicas esperan al hover para no
   bajar cinco videos de entrada. Con movimiento reducido, ninguna se mueve. */
function cardMedia(item, big) {
  if (!item.loop || REDUCED) return figureFor(item);
  var poster = thumbUrl(item) || "";
  return '<video class="figimg" src="' + esc(item.loop) + '" poster="' + esc(poster) + '"'
    + (big ? ' data-auto preload="auto"' : ' data-hover preload="none"')
    + ' muted loop playsinline aria-hidden="true"></video>';
}

/* Un clip de papel en metal gris: el trazo es un solo path de alambre. */
function clipSvg(cls, label) {
  return '<svg class="' + cls + '" viewBox="0 0 17 40" role="img" aria-label="' + esc(label) + '">'
    + '<title>' + esc(label) + '</title>'
    + '<path d="M12.5 13v17.5a4 4 0 0 1-8 0V7.5a2.6 2.6 0 0 1 5.2 0V29a1.3 1.3 0 0 1-2.6 0V12" fill="none"'
    + ' stroke="#A9AFAB" stroke-width="1.8" stroke-linecap="round"/></svg>';
}

function bulletText(b) { return typeof b === "string" ? b : (b && b.t) || ""; }

/* LA HOJA DESTACADA (v5). slot 0 es la grande; 1-4, el 2×2.
   🔑 Ya no lleva sello de IA (13-oct): por tarjeta daba a entender que todo
   estaba hecho con IA. Eso lo dice una nota en el inspector, solo donde aplica. */
function cardHtml(f, slot, role) {
  var item = f.item, t = COPY[state.lang], big = slot === 0, isTool = f.g === "t";
  var hand = (HANDS[f.g] || [])[f.i] || [pick(item.title), ""];
  var seals = [];
  if (item.award) seals.push({ txt: pick(item.award), award: true });
  if (item.nda) seals.push({ txt: "NDA" });
  if (item.youtubeId) seals.push({ txt: t.watch });
  /* orgShort: la cabecera de una chica del 2×2 mide ~230 px; el nombre largo
     vive en el inspector. */
  var head = isTool ? toolType(item) + " · " + pick(item.meta) : t.tProject + " · " + pick(item.orgShort || item.org);

  var h = '<button type="button" class="pin f' + (slot + 1) + '" style="' + accVars(item, slot) + ';--k:' + slot + '"'
        + ' data-g="' + f.g + '" data-i="' + f.i + '"'
        + ' aria-label="' + esc(pick(item.title)) + ' · ' + esc(t.inspect) + '">';
  h += '<div class="ring" aria-hidden="true"><i class="rhalo"></i><i class="rline"></i></div>';
  h += '<div class="hand">' + esc(hand[0])
     + (hand[1] ? ' <span class="dashx">&#183; ' + esc(pick(hand[1])) + '</span>' : '') + '</div>';
  h += '<div class="sheet"><i class="tape t1"></i><i class="tape t2"></i>';
  if (item.docs && item.docs.length) h += clipSvg("clipicon", t.hasDocs);
  h += '<div class="chead"><span>' + esc(head) + '</span></div>';
  h += '<div class="figbox">' + cardMedia(item, big) + '</div>';
  /* La tira de 3 capturas solo existe si hay galería de verdad: nada de huecos. */
  var gal = item.gallery || [];
  if (big && gal.length >= 4) {
    h += '<div class="minis" aria-hidden="true">' + gal.slice(1, 4).map(function (g) {
      return '<span><img src="' + esc(g.src) + '" alt="" loading="lazy" decoding="async"></span>';
    }).join("") + '</div>';
  }
  /* El pie de figura solo en la grande: en una chica de ~200 px eran dos
     renglones de ruido (v5.1). */
  if (big) h += '<div class="ccap">' + esc(figCaption(item, figNumber(f.g, f.i))) + '</div>';
  h += '<div class="ctitle">' + esc(pick(item.title)) + '</div>';
  if (big) {
    h += '<div class="cbody">' + esc(pick(isTool ? firstSentence(pick(item.body)) : item.short)) + '</div>';
    var raw = pick(item.bullets) || [];
    var idx = (item.proof && item.proof[role]) || [];
    var proof = idx.map(function (k) { return firstSentence(bulletText(raw[k])); })
                   .filter(function (x) { return x; });
    if (proof.length) {
      h += '<ul class="proof">' + proof.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
    }
  }
  if (seals.length) {
    h += '<div class="seals">' + seals.map(function (s) {
      return '<span class="seal' + (s.award ? " award" : "") + '">' + esc(s.txt) + '</span>';
    }).join("") + '</div>';
  }
  h += '<div class="rows">';
  if (isTool) h += '<span>' + esc(t.rType) + '</span><b>' + esc(pick(item.kind)) + '</b>';
  else {
    h += '<span>' + esc(t.rRole) + '</span><b>' + esc(pick(item.role)) + '</b>';
    if (big) h += '<span>' + esc(t.rStack) + '</span><b>' + esc(pick(item.stack)) + '</b>'
      + '<span>' + esc(t.rTeam) + '</span><b>' + esc(pick(item.team)) + '</b>';
  }
  h += '</div></div></button>';
  return h;
}

/* EL RENGLÓN DEL ARCHIVO: miniatura en papel, título y una línea de contexto.
   Abre el mismo inspector que una hoja destacada. */
function archRowHtml(f, n) {
  var item = f.item, t = COPY[state.lang], isTool = f.g === "t";
  var meta = isTool ? toolType(item) + " · " + pick(item.meta) : pick(item.org) + " · " + pick(item.dates);
  var line = isTool ? pick(item.kind) : pick(item.role);
  return '<li><button type="button" class="arow" style="' + accVars(item, n) + '"'
    + ' data-g="' + f.g + '" data-i="' + f.i + '"'
    + ' aria-label="' + esc(pick(item.title)) + ' · ' + esc(t.inspect) + '">'
    + '<div class="thumb">' + figureFor(item) + '</div>'
    + '<div><div class="atitle">' + esc(pick(item.title))
    + (item.award ? ' <i>&#183; ' + esc(pick(item.award)) + '</i>' : '')
    + (item.docs && item.docs.length ? clipSvg("clipmini", t.hasDocs) : '') + '</div>'
    + '<div class="ameta">' + esc(meta) + '</div>'
    + '<div class="arole">' + esc(line) + '</div></div></button></li>';
}

/* =========================================================================
   EL INSPECTOR. La misma hoja, ampliada. El pizarrón se oscurece detrás pero
   no se mueve: no es otra pantalla, es la misma hoja despegada de la pared.
   Se arma en piezas a propósito — cambiar de idioma reescribe el texto pero
   nunca toca el nodo del video, así que lo que esté sonando sigue sonando.
   ========================================================================= */

function modalCtx() {
  var o = state.open;
  if (!o) return null;
  var isTool = o.g === "t";
  var p = isTool ? TOOLS[o.i] : PROJECTS[o.i];
  if (!p) return null;
  return { isTool: isTool, p: p, i: o.i, g: o.g, t: COPY[state.lang], labels: TAG_LABELS[state.lang] };
}

function modalKey() { return state.open ? state.open.g + ":" + state.open.i : ""; }

function rowsFor(c) {
  var p = c.p, t = c.t, r = [];
  if (c.isTool) {
    /* Las herramientas tienen otro modelo: kind y meta en vez de org y fechas. */
    r.push([t.rType, pick(p.kind)]);
    r.push([t.rSource, pick(p.meta)]);
    var rt = pick(p.roleTags) || [];
    if (rt.length) r.push([t.rRole, rt.join(" · ")]);
  } else {
    r.push([t.rOrg, pick(p.org)]);
    r.push([t.rDates, pick(p.dates)]);
    if (p.role) r.push([t.rRole, pick(p.role)]);
    if (p.stack) r.push([t.rStack, pick(p.stack)]);
    if (p.team) r.push([t.rTeam, pick(p.team)]);
  }
  return r.filter(function (x) { return x[1]; });
}

function modalHeadHtml(c) {
  var p = c.p, t = c.t;
  var tags = (p.tags || []).map(function (tg) { return c.labels[tg] || tg; });
  var left = [c.isTool ? toolType(p) : t.tProject].concat(tags);
  if (p.nda) left.push("NDA");
  var h = '<div class="itop"><span>' + esc(left.join(" · ")) + '</span>';
  h += '<span>' + esc(pick(c.isTool ? p.meta : p.dates) || "") + '</span></div>';
  h += '<div class="ititle">' + esc(pick(p.title)) + '</div>';
  /* v5.1 (14-oct): la descripción larga ya no abre la hoja; vive en la columna
     lateral, junto al video, donde antes quedaba un hueco de ~300 px. */
  return h;
}

/* v5: lo que se puede mirar en la pieza grande, en orden. El video (si hay)
   va primero y después las capturas. Con menos de dos piezas no hay tira. */
function mediaList(p) {
  var m = [];
  if (p.youtubeId) m.push({ kind: "video" });
  (p.gallery || []).forEach(function (g) { m.push({ kind: "img", src: g.src, cap: g.cap }); });
  return m;
}

/* La pieza grande: el video si lo hay, una captura de la galería, o la figura.
   Va al ancho de la hoja y no en una columna de 315 px. */
function modalLeadHtml(c) {
  var p = c.p;
  var m = mediaList(p), cur = m[state.media] || m[0];
  if (cur && cur.kind === "video") {
    return '<div class="figbox"><div class="ivideo" id="modalVideo">' + videoInnerHtml(c) + '</div></div>';
  }
  if (cur && cur.kind === "img") {
    return '<div class="figbox"><img class="istill" src="' + esc(cur.src) + '" alt="' + esc(pick(cur.cap)) + '"></div>'
      + '<div class="ccap" style="margin-top:6px">' + esc(pick(cur.cap)) + '</div>';
  }
  return '<div class="figbox">' + figureFor(p) + '</div>'
    + '<div class="ccap" style="margin-top:6px">' + esc(figCaption(p, figNumber(c.g, c.i))) + '</div>';
}

function modalStripHtml(c) {
  var m = mediaList(c.p), t = c.t;
  if (m.length < 2) return "";
  /* Una sola fila siempre: tantas columnas como piezas (el video + 5 capturas
     de Tatemis partían la tira en dos renglones con 5 columnas fijas). */
  return '<div class="strip" style="grid-template-columns:repeat(' + m.length + ',minmax(0,1fr))">' + m.map(function (x, k) {
    var src = x.kind === "video" ? bigUrl(c.p) : x.src;
    var lab = x.kind === "video" ? t.stripVideo : t.stripShot + " · " + pick(x.cap);
    return '<button type="button" data-m="' + k + '" aria-current="' + (k === state.media) + '"'
      + ' aria-label="' + esc(lab) + '"><img src="' + esc(src) + '" alt="" loading="lazy" decoding="async">'
      + (x.kind === "video" ? '<span class="sv"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"></path></svg></span>' : '')
      + '</button>';
  }).join("") + '</div>';
}

function modalSideHtml(c) {
  var p = c.p, t = c.t;
  var h = '<p class="isub">' + esc(pick(c.isTool ? p.body : p.desc)) + '</p>';
  h += '<div class="irows">' + rowsFor(c).map(function (r) {
    return '<span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b>';
  }).join("") + '</div>';

  var links = p.links || [];
  if (links.length) {
    h += '<div class="ilinks">' + links.map(function (l) {
      return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">'
        + esc(pick(l.label)) + ' &#8599;</a>';
    }).join("") + '</div>';
  }
  /* v5 (13-oct): UNA nota de IA por ficha, solo donde aplica, y diciendo para
     qué. Reemplaza al sello por tarjeta y a la marca por punto. Don't Chicken
     Out!, Prismonaut y los proyectos de antes de usar IA no la llevan. */
  if (p.aiUse) h += '<p class="iai"><b>' + esc(t.aiUseLabel) + '</b> ' + esc(pick(p.aiUse)) + '</p>';
  h += '<div class="inote">' + esc(t.updated) + ' ' + esc(lastUpdatedText(state.lang)) + '</div>';
  return h;
}

/* El video. Antes del clic, el póster es el loop mudo de la ficha corriendo
   (o su imagen fija, con movimiento reducido): nada de YouTube se carga hasta
   que se pide. */
function videoInnerHtml(c) {
  var p = c.p, big = bigUrl(p);
  if (state.playing) {
    return '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(p.youtubeId)
      + '?autoplay=1&amp;rel=0" title="Gameplay video" allow="accelerometer; autoplay; clipboard-write; '
      + 'encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  }
  var h;
  if (p.loop && !REDUCED) {
    h = '<video src="' + esc(p.loop) + '" poster="' + esc(big || "") + '" autoplay muted loop playsinline aria-hidden="true"></video>';
  } else if (big) {
    h = '<div class="iposter" style="background-image:' + cssUrl(big) + '"></div>';
  } else {
    h = '<div class="figgap"><i></i><span>' + esc(coverPath(p)) + '</span></div>';
  }
  return h + '<button type="button" class="iplay" id="modalPlay" aria-label="' + esc(COPY[state.lang].playHint)
    + '"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"></path></svg></i></button>';
}

/* Debajo de los puntos: cómo funciona, documentos y código. Cada bloque existe
   solo si la ficha tiene algo que poner (regla de Andrés del 13-oct: igual que
   Recognition, nada de bloques vacíos ni "próximamente"). */
function modalBlocksHtml(c) {
  var p = c.p, t = c.t, out = [];
  var leadIsFig = !mediaList(p).length && !thumbUrl(p);
  if (p.diag && DIAGRAMS[p.diag] && !leadIsFig) {
    out.push('<div><h4>' + esc(t.howItWorks) + '</h4><div class="how">' + figSvg(p.diag) + '</div>'
      + '<div class="ccap" style="margin-top:6px">' + esc(pick(DIAGRAMS[p.diag].cap)) + '</div></div>');
  }
  if (p.docs && p.docs.length) {

/* =========================================================================
   MARCAS DE TIZA — dos capas, igual que los diagramas: el núcleo nítido y la
   capa con textura encima. El texto nunca se filtra; esto es dibujo.
   ========================================================================= */
function chalkMark(id, box, col, cls, core, thick, o1, o2) {
  return '<svg class="' + cls + '" viewBox="0 0 ' + box + '" aria-hidden="true">'
    + '<g style="--sw:' + core + ';--nk:' + col + '" opacity="' + o1 + '">'
    + '<use href="#' + id + '"/></g>'
    + '<g style="--sw:' + thick + ';--nk:' + col + '" opacity="' + o2 + '" filter="url(#chalk)">'
    + '<use href="#' + id + '"/></g></svg>';
}

/* El riel se estira con la fila: preserveAspectRatio none deforma un trazo,
   pero no un relleno, así que el riel es un rect y no una línea. */
function railSvg() {
  return '<svg viewBox="0 0 22 200" preserveAspectRatio="none" aria-hidden="true">'
    + '<g style="--nk:#F0F2ED" opacity=".2"><use href="#tlRail"/></g>'
    + '<g style="--nk:#F0F2ED" opacity=".46" filter="url(#chalk)"><use href="#tlRail"/></g></svg>';
}

function nodeSvg(current) {
  return current
    ? chalkMark("tlNodeCur", "22 22", "#D9E36B", "tlnode", 1.9, 2.7, ".4", ".95")
    : chalkMark("tlNode", "22 22", "#F0F2ED", "tlnode", 1.8, 2.6, ".34", ".8");
}

/* Los videos de las hojas: la grande corre solo mientras se ve; las chicas, al
   pasar el mouse. Pausar lo que no se ve importa: la página ya es pesada por
   los filtros de tiza. */
var videoObs = null;
function observeVideos() {
  if (REDUCED) return;
  var autos = document.querySelectorAll("video[data-auto]");
  if (!("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(autos, function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); });
    return;
  }
  if (!videoObs) {
    videoObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var v = en.target;
        if (state.open) return;
        if (en.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        else v.pause();
      });
    }, { threshold: 0.15 });
  }
  Array.prototype.forEach.call(autos, function (v) { videoObs.observe(v); });
}

/* EL GRÁFICO DE LA TRAYECTORIA. Eje de 2022 a 2026, en meses. "end: now"
   llega hasta la fecha de LAST_UPDATE; fuzzy difumina el extremo cuyo mes no
   se conoce (no se inventa). */
var TL_FROM = 2022, TL_YEARS = 5;
function tlPos(ym) {
  var p = (ym === "now" ? LAST_UPDATE.slice(0, 7) : ym).split("-");
  return Math.max(0, Math.min(1, ((+p[0] - TL_FROM) * 12 + (+p[1] - 1)) / (TL_YEARS * 12)));
}
function tlRow(e, name, sub, small, isCur, t) {
  var f = findItem(e.open);
  var acc = e.acc || (f && f.item.acc) || "space";
  var segs = e.segs || [[e.start, e.end]];
  var bars = segs.map(function (sg) {
    var x0 = tlPos(sg[0]), x1 = sg[1] === "now" ? tlPos("now") : tlPos(sg[1]) + 1 / (TL_YEARS * 12);
    return '<i class="tlbar" style="left:' + (x0 * 100).toFixed(2) + '%;width:' + ((x1 - x0) * 100).toFixed(2) + '%"></i>';
  }).join("");
  /* Si empieza antes del eje (Toulouse, 2019), lo dice en vez de cortarse mudo. */
  var y0 = +segs[0][0].slice(0, 4);
  if (y0 < TL_FROM) bars += '<span class="tlpre">&#8592; ' + (t.tlSince || "since") + ' ' + y0 + '</span>';
  var tag = f ? "button" : "div";
  return '<' + tag + (f ? ' type="button"' : '') + ' class="tlrow2" style="--kc:var(--k-' + acc + ')"'
    + (f ? ' data-g="' + f.g + '" data-i="' + f.i + '"' : '') + '>'
    + '<div class="tllab"><h3>' + esc(name) + (isCur ? '<em>' + esc(t.current) + '</em>' : '') + '</h3>'
    + '<p>' + esc(sub) + '</p><small>' + esc(small) + '</small></div>'
    + '<div class="tltrack">' + bars + '</div></' + tag + '>';
}
function timelineHtml(t) {
  var h = '<div class="tlaxis" aria-hidden="true">';
  for (var y = 0; y <= TL_YEARS; y++) {
    var x = (y / TL_YEARS * 100).toFixed(2);
    h += '<i style="left:' + x + '%"></i>';
    if (y < TL_YEARS) h += '<span style="left:' + ((y + .5) / TL_YEARS * 100).toFixed(2) + '%">' + (TL_FROM + y) + '</span>';
  }
  h += '</div><div class="tlbody2" style="--now:' + tlPos("now") + '">';
  h += '<div class="tlnow" style="left:calc(var(--lab,334px) + (100% - var(--lab,334px)) * var(--now))"><b>' + esc(t.tlNow) + '</b></div>';
  h += '<div class="tlgroup">' + esc(t.tlStudios) + '</div>';
  h += TIMELINE.map(function (e) {
    return tlRow(e, pick(e.org), pick(e.role), pick(e.dates) + " · " + pick(e.kind), e.current, t);
  }).join("");
  h += '<div class="tlgroup">' + esc(t.tlTraining) + '</div>';
  h += EDUCATION.map(function (e) {
    return tlRow(e, pick(e.school), pick(e.program), pick(e.dates) + (e.note ? " · " + pick(e.note) : ""), false, t);
  }).join("");
  return h + '</div>';
}

function closeModal() {
  var ov = $("overlay");

  ov.classList.add("is-out");
  setTimeout(function () {
    if ($("modalRoot").firstChild === ov) $("modalRoot").innerHTML = "";
    /* el fondo se reanuda recien al final, para que la salida tampoco tironee */
    if (!state.open) document.documentElement.classList.remove("modal-open");
  }, 210);
}

/* Con el inspector abierto, los videos de la página se pausan: nadie los ve y
   competían con el del inspector. Al cerrar, vuelven los que corrían. */
var pausedByModal = [];
function pagePlayback(on) {
  if (!on) {
    pausedByModal = Array.prototype.filter.call(document.querySelectorAll(".wrap video"), function (v) { return !v.paused; });
    pausedByModal.forEach(function (v) { v.pause(); });
  } else {
    pausedByModal.forEach(function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); });
    pausedByModal = [];
  }
}

function renderModal() {
  if (state.open && !pausedByModal.length) pagePlayback(false);
  $("modalRoot").innerHTML = modalHtml();
  modalShown = modalKey();
  document.body.style.overflow = state.open ? "hidden" : "";
  if (state.open) document.documentElement.classList.add("modal-open");
}

function refreshModal() {
  var c = modalCtx();
  var head = $("modalHead");
  if (!c || !head || !$("modalLead")) { renderModal(); return; }
  head.innerHTML = modalHeadHtml(c);
  $("modalSide").innerHTML = modalSideHtml(c);
  $("modalStrip").innerHTML = modalStripHtml(c);
  $("modalRest").innerHTML = modalRestHtml(c);
  /* La pieza grande solo se rehace si es una captura (su pie cambia de idioma).
     Si es el video, no se toca: lo que suena sigue sonando. */
  if (!$("modalVideo")) $("modalLead").innerHTML = modalLeadHtml(c);
}

/* Cambiar la pieza grande desde la tira, sin tocar el resto del inspector. */
function showMedia(k) {
  var c = modalCtx();
  if (!c) return;
  state.media = k; state.playing = false;
  $("modalLead").innerHTML = modalLeadHtml(c);
  Array.prototype.forEach.call(document.querySelectorAll("#modalStrip [data-m]"), function (b) {
    b.setAttribute("aria-current", Number(b.getAttribute("data-m")) === k ? "true" : "false");
  });
}

/* El cambio animado: lo que está se despega, se rehace la grilla y lo nuevo
   se pega. Con movimiento reducido, cambio seco. */
var swapping = false;
function swapRole(r) {
  if ((r === "ud" ? "ud" : "td") === state.role || swapping) return;
  if (REDUCED) { setRole(r); return; }
  swapping = true;
  var els = [$("projectsGrid"), $("archList")];
  els.forEach(function (el) { el.classList.add("is-out"); });
  setTimeout(function () {
    setRole(r);
    els.forEach(function (el) { el.classList.remove("is-out"); el.classList.add("is-in"); void el.offsetWidth; });
    requestAnimationFrame(function () {
      els.forEach(function (el) { el.classList.remove("is-in"); });
      setTimeout(function () { swapping = false; }, 520);
    });
  }, 300);
}
function swapFilter(f) {
  if (f === state.filter) return;
  var list = $("archList");
  if (REDUCED) { state.filter = f; applyFilter(); return; }
  list.classList.add("is-out");
  setTimeout(function () {
    state.filter = f; applyFilter();
    list.classList.remove("is-out"); list.classList.add("is-in"); void list.offsetWidth;
    requestAnimationFrame(function () { list.classList.remove("is-in"); });
  }, 220);
}

/* El perfil viaja en la URL (?r=ud) para mandar el enlace directo en cada
   postulación. replaceState y no pushState: cambiar de pestaña no es navegar. */
function setRole(r) {
  state.role = r === "ud" ? "ud" : "td";
  renderProfile();
  try {
    var u = new URL(window.location.href);
    if (state.role === "td") u.searchParams.delete("r"); else u.searchParams.set("r", state.role);
    history.replaceState(null, "", u.toString());
  } catch (err) {}
}

/* ---------- reveal al scroll ---------------------------------------------- */
/* El observador y el CSS ya estaban escritos, pero ningún elemento llevaba la
   clase: document.querySelectorAll('.rv').length daba 0 y nada aparecía nunca.
   Eso era, literalmente, la ausencia de pacing. */
var REVEAL_SEL = ["#projectsGrid > *", "#recogList > *", ".tlrow2", ".lanes", ".bar2",
                  ".sec > .sechead", ".sec > .secnote", ".gap",
                  ".close2 > *"];
var firstPaint = true;

function markReveals() {
  REVEAL_SEL.forEach(function (sel) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) {
      if (!el.classList.contains("in")) el.classList.add("rv");
    });
  });
}

var revealObs = null;
function revealInit() {
  markReveals();
  /* Cambiar de idioma reescribe el DOM: si volviéramos a esconder todo, la
     página parpadearía entera. Solo la primera pintura se revela. */
  if (!firstPaint) {
    Array.prototype.forEach.call(document.querySelectorAll(".rv"), function (el) {
      el.classList.add("in");
    });
    return;
  }
  firstPaint = false;
  if (!("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(document.querySelectorAll(".rv"), function (el) { el.classList.add("in"); });
    return;
  }
  if (!revealObs) {
    revealObs = new IntersectionObserver(function (entries) {
      var n = 0;
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target;
        revealObs.unobserve(el);
        /* 🔑 Si el elemento ya entró de lleno en la pantalla —que es lo que
           pasa al scrollear rápido— aparece de una. Escalonarlo ahí lo dejaba
           en opacity 0 sobre un pizarrón negro: eso era el "queda todo en
           negro hasta que carga". */
        if (en.boundingClientRect.top < window.innerHeight * 0.62) {
          el.classList.add("in");
          return;
        }
        /* El escalonado se topa a cuatro pasos. Antes el índice era el de la
           tanda entera, así que una tanda de 30 elementos hacía esperar al
           último 1,7 s; y en un scroll rápido las tandas son grandes. */
        var d = Math.min(n++, 4) * 55;
        if (!d) el.classList.add("in");
        else setTimeout(function () { el.classList.add("in"); }, d);
      });
    }, { rootMargin: "200px 0px 140px 0px", threshold: 0.01 });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".rv:not(.in)"), function (el) { revealObs.observe(el); });
}

/* 🔑 Red de seguridad, y no es un adorno.
   IntersectionObserver se despacha desde el pipeline de render: si el hilo
   principal está ocupado rasterizando —y en esta página lo está, por los
   filtros de tiza— los avisos llegan tarde, y mientras tanto lo que está en
   pantalla sigue en opacity 0. O sea: cuanto más pesada la página, más tarda
   justo el mecanismo que la haría aparecer.
   El evento de scroll, en cambio, no depende de que se pinte un frame. Así que
   esto barre lo que haya quedado invisible a la vista, ESTRANGULADO y no
   pospuesto: durante un scroll largo y rápido un debounce no llegaría a
   dispararse nunca. */
var sweepLast = 0, sweepPend = false;

function doSweep() {
  var vh = window.innerHeight;
  var quedan = document.querySelectorAll(".rv:not(.in)");
  Array.prototype.forEach.call(quedan, function (el) {
    var r = el.getBoundingClientRect();
    if (r.bottom > -60 && r.top < vh + 60) {
      el.classList.add("in");
      if (revealObs) revealObs.unobserve(el);
    }
  });
  /* Cuando ya no queda nada por revelar el oyente se desengancha solo. */
  if (quedan.length === 0) window.removeEventListener("scroll", revealSweep);
}

function revealSweep() {
  var ahora = +new Date();
  if (ahora - sweepLast > 120) { sweepLast = ahora; doSweep(); return; }
  if (sweepPend) return;
  sweepPend = true;
  setTimeout(function () { sweepPend = false; sweepLast = +new Date(); doSweep(); }, 120);
}

/* La barra cambia de estado una sola vez, a los 40 px. Va con un centinela y
   no con window.scrollY: así funciona igual si el que hace scroll no es la
   ventana sino un contenedor (una vista previa embebida, por ejemplo). */
function barStateInit() {
  var wrap = $("barwrap"), sentinel = $("barSentinel");
  if (!wrap || !sentinel) return;
  if (!("IntersectionObserver" in window)) {
    window.addEventListener("scroll", function () {
      wrap.classList.toggle("is-stuck", window.scrollY > 40);
    }, { passive: true });
    return;
  }
  new IntersectionObserver(function (entries) {
    wrap.classList.toggle("is-stuck", !entries[0].isIntersecting);
  }, { threshold: 0 }).observe(sentinel);
}

/* ---------- navegacion ----------------------------------------------------- */
/* La nav hace scroll por JS y NO cambia la URL: nada de hashes. */
/* La barra es fija: tapa la franja de arriba, así que ni el salto ni la sonda
   del scroll-spy pueden medir contra el borde de la ventana. */
function barH() {
  var w = $("barwrap");
  return w ? Math.round(w.getBoundingClientRect().height) : 0;
}

function scrollToKey(key) {
  var s = SECTIONS.filter(function (x) { return x.key === key; })[0];
  var el = s && $(s.el);
  if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - barH() - 18,
    behavior: "smooth" });
  closeDrawer();
}

function setNavActive() {
  [$("nav"), $("navM")].forEach(function (n) {
    Array.prototype.forEach.call(n.children, function (b) {
      b.className = b.getAttribute("data-key") === state.active ? "is-active" : "";
    });
  });
}

function onScroll() {
  /* La sonda arranca debajo de la barra, no en el borde de la ventana. */
  var probe = barH() + (window.innerHeight - barH()) * 0.3;
  var active = "";
  SECTIONS.forEach(function (s) {
    var el = $(s.el);
    if (el && el.getBoundingClientRect().top <= probe) active = s.key;
  });
  /* Al fondo de la página gana la última sección aunque su borde superior no
     haya cruzado la sonda: si no, Contact nunca se podía marcar. */
  var atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  if (atEnd) active = SECTIONS[SECTIONS.length - 1].key;
  if (active !== state.active) { state.active = active; setNavActive(); }
}

function closeDrawer() {
  $("drawer").classList.remove("is-open");
  $("burger").setAttribute("aria-expanded", "false");
}

/* ---------- eventos -------------------------------------------------------- */
document.addEventListener("click", function (e) {
  var b;

  /* Selector de CV. Va primero porque el clic fuera tiene que cerrarlo aunque
     el clic caiga sobre otra cosa que si se maneja abajo. */
  if ((b = e.target.closest(".cvpick > button"))) {
    toggleCvMenu(b, b.getAttribute("aria-expanded") !== "true");
    return;
  }
  /* Elegir un CV descarga y cierra: sin preventDefault, la descarga sigue. */
  if (e.target.closest(".cvmenu a")) { closeCvMenus(); return; }
  if (!e.target.closest(".cvmenu")) closeCvMenus();

  if ((b = e.target.closest("button[data-key]"))) { scrollToKey(b.getAttribute("data-key")); return; }

  if ((b = e.target.closest("button[data-lang]"))) {
    state.lang = b.getAttribute("data-lang");
    try { localStorage.setItem("arzpal-lang", state.lang); } catch (err) {}
    render();
    return;
  }

  if (e.target.closest("#brandMark")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    closeDrawer();
    return;
  }

  if (e.target.closest("#burger")) {
    var abierto = $("drawer").classList.toggle("is-open");
    $("burger").setAttribute("aria-expanded", abierto ? "true" : "false");
    return;
  }

  /* el poster inyecta el iframe; el resto del inspector no se toca */
  if (e.target.closest("#modalPlay")) { playVideo(); return; }
  if ((b = e.target.closest("#modalStrip [data-m]"))) { showMedia(Number(b.getAttribute("data-m"))); return; }

  if ((b = e.target.closest(".tab[data-r]"))) { swapRole(b.getAttribute("data-r")); return; }
  if ((b = e.target.closest("#archFilter [data-f]"))) { swapFilter(b.getAttribute("data-f")); return; }

  if (e.target.closest("#reelBtn")) {
    var rv = $("reelVideo");
    if (rv.paused) { rv.reelUser = false; var pr = rv.play(); if (pr && pr.catch) pr.catch(function () {}); }
    else { rv.reelUser = true; rv.pause(); }
    return;
  }

  /* Hojas destacadas y renglones del archivo abren el mismo inspector. La hoja
     del cierre no abre nada: es contacto, no una ficha. */
  if ((b = e.target.closest("[data-g][data-i]"))) {
    state.open = { g: b.getAttribute("data-g"), i: Number(b.getAttribute("data-i")) };
    state.playing = false; state.media = 0;
    renderModal();
    return;
  }

  if (e.target.closest("#modalClose")) { closeModal(); return; }
  if (e.target.id === "overlay") { closeModal(); }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    /* El popover se cierra primero y devuelve el foco a su boton: es lo mas
       cercano que hay abierto, y cerrar el modal por debajo desorienta. */
    var cv = document.querySelector('.cvpick > button[aria-expanded="true"]');
    if (cv) { toggleCvMenu(cv, false); cv.focus(); return; }
    if (state.open) { closeModal(); }
    else closeDrawer();
  }
});

/* Las chicas del 2×2 corren su loop solo mientras el mouse (o el foco) está
   encima. En táctil no hay hover: se quedan en el póster. */
function hoverVideo(e, on) {
  var pin = e.target.closest && e.target.closest(".pin");
  if (!pin || (e.relatedTarget && pin.contains(e.relatedTarget))) return;
  var v = pin.querySelector("video[data-hover]");
  if (!v || REDUCED) return;
  if (on) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause();
}
document.addEventListener("mouseover", function (e) { hoverVideo(e, true); });
document.addEventListener("mouseout", function (e) { hoverVideo(e, false); });
document.addEventListener("focusin", function (e) { hoverVideo(e, true); });
document.addEventListener("focusout", function (e) { hoverVideo(e, false); });

window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("scroll", revealSweep, { passive: true });

/* El idioma elegido sobrevive a la recarga; si no hay nada guardado, arranca
   en inglés, que es a quién le habla el portafolio. */
try {
  var guardado = localStorage.getItem("arzpal-lang");
  if (guardado === "en" || guardado === "es") state.lang = guardado;
} catch (err) {}

/* ?r=ud abre directo la vista de Unity Developer; sin parámetro, Technical
   Designer (decidido el 13-oct). */
try {
  if (new URLSearchParams(window.location.search).get("r") === "ud") state.role = "ud";
} catch (err) {}

render();
onScroll();
barStateInit();

/* El reel: mudo, en loop, y solo si no se pidió movimiento reducido. */
(function () {
  var v = $("reelVideo");
  if (!v) return;
  v.addEventListener("play", setReelBtn);
  v.addEventListener("pause", setReelBtn);
  /* reelUser: si la persona lo pausó, no se reanuda solo al volver a verlo. */
  v.reelUser = false;
  if (!REDUCED && "IntersectionObserver" in window) {
    new IntersectionObserver(function (en) {
      if (state.open) return;
      if (en[0].isIntersecting) { if (!v.reelUser) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } }
      else if (!v.paused) v.pause();
    }, { threshold: 0.1 }).observe(v);
  } else if (!REDUCED) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  setReelBtn();
})();

</script>
