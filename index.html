<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrés Ruiz Palomino · Gameplay Systems &amp; Tools Programmer</title>
<meta name="description" content="Gameplay systems, editor tooling and the feel layer on top of them. Unity / C# programmer based in Peru.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DESIGN TOKENS — no agregar colores nuevos. Si hace falta un tono, derivarlo
   de estos. La pagina es blanco y negro; el aqua es acento, nunca fondo de area.
   ========================================================================== */
:root{
  --bg:#08090a; --bg-alt:#0f1112; --card:#0f1112; --card-inner:#0b0d0e;
  --rule:#1a1d20; --border:#1e2124; --border-ctrl:#23272a; --border-hover:#2b3134;
  --white:#ffffff; --ui:#f4f6f7; --body:#c1c8cb; --ai-body:#a9b1b5;
  --sec:#8d9498; --dim:#7c8286; --faint:#5b6165; --ghost:#4a5054;
  --aqua:#00e5c0; --aqua-hi:#6ffbe2; --on-aqua:#04100e;
  --aqua-line:#14453c; --aqua-line-on:#1d6355;
  --f-display:'Archivo',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ui);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--aqua);text-decoration:none}
a:hover{color:var(--aqua-hi)}
::selection{background:var(--aqua);color:var(--on-aqua)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}

.sec{border-bottom:1px solid var(--rule)}
.sec--alt{background:var(--bg-alt)}
.sec-inner{max-width:1240px;margin:0 auto;padding:92px 36px 100px}

/* ---------- barra superior (por encima del modal a proposito) ------------- */
.topbar{position:sticky;top:0;z-index:200;background:rgba(8,9,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:15px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ui)}
.brand span{color:var(--aqua)}
.topbar-right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:26px;margin-right:14px;font-family:var(--f-mono);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.nav button{cursor:pointer;padding-bottom:2px;transition:color .18s ease;color:var(--sec);border-bottom:1px solid transparent}
.nav button.is-active{color:var(--aqua);border-bottom-color:var(--aqua)}
.hairline{width:1px;height:20px;background:var(--border-ctrl)}
.ai-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 6px 4px 11px;border-radius:99px;border:1px solid var(--border-ctrl);background:#101315;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;transition:color .18s ease,border-color .18s ease;color:var(--faint)}
.ai-toggle:hover{border-color:var(--border-hover)}
.ai-toggle.is-on{color:var(--ui)}
.switch{position:relative;width:38px;height:20px;border-radius:99px;flex:none;transition:background .2s ease,border-color .2s ease;border:1px solid var(--border-hover);background:#14171a}
.ai-toggle.is-on .switch{border-color:var(--aqua-line-on);background:rgba(0,229,192,.14)}
.knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;transition:left .2s cubic-bezier(.4,.1,.2,1),background .2s ease;background:var(--ghost)}
.ai-toggle.is-on .knob{left:20px;background:var(--aqua)}
.langswitch{display:flex;border:1px solid var(--border-ctrl);border-radius:6px;overflow:hidden;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1px}
.langswitch button{padding:5px 9px;cursor:pointer;background:transparent;color:var(--sec)}
.langswitch button.is-active{background:var(--aqua);color:var(--on-aqua)}

/* ---------- hero --------------------------------------------------------- */
.hero{position:relative;overflow:hidden;background:var(--bg);border-bottom:1px solid var(--rule)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(#12161a 1px,transparent 1px),linear-gradient(90deg,#12161a 1px,transparent 1px);background-size:76px 76px;mask-image:radial-gradient(115% 85% at 12% 8%,#000 0%,transparent 68%);-webkit-mask-image:radial-gradient(115% 85% at 12% 8%,#000 0%,transparent 68%);pointer-events:none}
.hero-inner{position:relative;max-width:1240px;margin:0 auto;padding:110px 36px 84px}
.eyebrow-row{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.eyebrow-dash{width:44px;height:2px;background:var(--aqua);flex:none}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:2.6px;text-transform:uppercase;color:var(--aqua);font-weight:500}
.hero h1{margin:0 0 22px;font-family:var(--f-display);font-weight:800;font-size:clamp(52px,10vw,132px);line-height:.88;letter-spacing:-4px;text-transform:uppercase;color:var(--white);max-width:13ch}
.hero-role{margin:0 0 44px;max-width:46ch;font-family:var(--f-display);font-weight:500;font-size:clamp(18px,2.1vw,24px);line-height:1.32;letter-spacing:-.4px;color:#9aa2a7}
.hero-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start;max-width:1050px}
.hero-p1{margin:0;font-size:18px;line-height:1.62;color:#dfe4e6;text-wrap:pretty}
.hero-side{display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--border);padding-left:28px}
.hero-p3{margin:0;font-size:16.5px;line-height:1.66;color:var(--body);text-wrap:pretty}
.hero-p2{margin:0;font-size:14.5px;line-height:1.66;color:var(--dim);text-wrap:pretty}
.ai-block{margin:38px 0 0;max-width:1050px;border-top:1px solid var(--border);padding-top:26px;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:start}
.ai-block-label{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--aqua)}
.ai-block-label i{width:22px;height:1px;background:var(--aqua);flex:none}
.ai-block p{margin:0;max-width:74ch;font-size:15.5px;line-height:1.66;color:var(--ai-body);text-wrap:pretty}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:38px 0 32px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.pills div{color:var(--sec);border:1px solid var(--border);background:var(--card);padding:6px 12px;border-radius:5px}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 22px;border-radius:7px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.btn svg{width:15px;height:15px;fill:currentColor;flex:none}
.btn-primary{background:var(--aqua);border:1px solid var(--aqua);color:var(--on-aqua);transition:transform .16s ease,box-shadow .16s ease}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(0,229,192,.6);color:var(--on-aqua)}
.btn-ghost{border:1px solid #262b2e;background:transparent;color:var(--ui);transition:border-color .16s ease,transform .16s ease}
.btn-ghost:hover{border-color:var(--aqua);transform:translateY(-2px);color:var(--ui)}

/* ---------- cabeceras de seccion ----------------------------------------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.sec-num-row{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.sec-num{font-family:var(--f-mono);font-size:12px;color:var(--aqua);letter-spacing:1.4px}
.sec-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.4vw,50px);letter-spacing:-1.6px;text-transform:uppercase;color:var(--white)}
.sec-note{margin:0;max-width:56ch;font-size:15px;color:var(--dim)}
.click-hint{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);letter-spacing:1px;text-transform:uppercase}

/* ---------- tarjetas ------------------------------------------------------ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{cursor:pointer;text-align:left;width:100%;display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s ease,transform .2s ease}
.card:hover{border-color:var(--aqua);transform:translateY(-3px)}
.card-media{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-bottom:1px solid var(--border);overflow:hidden}
.card-thumb{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;filter:grayscale(1) contrast(1.08);transition:filter .3s ease}
.card:hover .card-thumb{filter:grayscale(0) contrast(1)}
.card-tags{position:absolute;z-index:3;top:12px;left:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 24px);font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
.card-tags div{padding:4px 8px;border-radius:4px;background:rgba(8,9,10,.82);border:1px solid rgba(255,255,255,.16);color:#e2e7e9;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card-nomedia{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#0b0d0e 0 8px,#101314 8px 16px)}
.card-nomedia div{font-family:var(--f-mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ghost);text-align:center;padding:0 20px}
.card-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.card-watch{position:absolute;z-index:2;bottom:12px;left:12px;display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:6px;background:rgba(8,9,10,.78);border:1px solid rgba(255,255,255,.18);font-family:var(--f-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ui)}
.card-watch svg{width:12px;height:12px;fill:var(--aqua)}
.card-body{padding:18px 20px 20px}
.card-titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card-title{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.22;letter-spacing:-.5px;color:var(--white)}
.card-dates{font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.card-orgrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.card-org{font-family:var(--f-mono);font-size:11.5px;color:var(--aqua);letter-spacing:.4px}
.card-short{margin:0;font-size:14px;line-height:1.55;color:var(--sec);text-wrap:pretty}
.ai-badge{padding:2px 7px;border-radius:4px;border:1px solid var(--aqua-line);background:rgba(0,229,192,.07);font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:1.2px;color:var(--aqua)}

/* ---------- timeline ------------------------------------------------------ */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:minmax(0,180px) 30px minmax(0,1fr);gap:0;align-items:start}
.tl-dates{font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.4px;padding:26px 20px 26px 0;text-align:right}
.tl-rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.tl-rail i{width:1px;background:var(--border-ctrl);height:100%}
.tl-dot{position:absolute;top:32px;width:9px;height:9px;border-radius:99px;background:var(--ghost);border:2px solid var(--bg-alt);box-shadow:0 0 0 3px var(--bg-alt)}
.tl-dot.is-current{background:var(--aqua)}
.tl-body{padding:26px 0 26px 24px}
.tl-titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tl-org{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.6px;color:var(--white)}
.tl-kind{font-family:var(--f-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.tl-role{font-family:var(--f-mono);font-size:12.5px;color:var(--aqua);margin:7px 0 9px;letter-spacing:.2px}
.tl-line{margin:0;max-width:70ch;font-size:15px;line-height:1.6;color:var(--sec);text-wrap:pretty}

/* ---------- educacion ----------------------------------------------------- */
.edu{display:flex;flex-direction:column;gap:16px;max-width:900px}
.edu-card{border:1px solid var(--border);border-left:2px solid var(--aqua);border-radius:10px;background:var(--card-inner);padding:24px 28px}
.edu-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.edu-school{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.5px;color:var(--white)}
.edu-dates{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);letter-spacing:.4px}
.edu-program{font-family:var(--f-mono);font-size:12.5px;color:var(--aqua);margin:8px 0 10px}
.edu-line{margin:0;font-size:15px;line-height:1.6;color:var(--sec);text-wrap:pretty}
.edu-note{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:7px 13px;border:1px solid var(--aqua-line);border-radius:6px;background:rgba(0,229,192,.05);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.6px;color:var(--aqua)}
.edu-note svg{width:13px;height:13px;fill:currentColor;flex:none}

/* ---------- contacto y pie ------------------------------------------------ */
.contact-inner{max-width:1240px;margin:0 auto;padding:92px 36px 60px}
.email-link{display:inline-block;font-family:var(--f-mono);font-size:clamp(18px,3.2vw,34px);font-weight:500;letter-spacing:-.8px;color:var(--white);border-bottom:2px solid var(--aqua);padding-bottom:5px}
.email-link:hover{color:var(--aqua)}
.socials{display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;font-family:var(--f-mono);font-size:12.5px}
.socials a{color:var(--sec)}
.socials a:hover{color:var(--aqua)}
.footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--f-mono);font-size:11px;color:var(--ghost);letter-spacing:.6px}

/* ---------- modal --------------------------------------------------------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,5,6,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:88px 24px 40px;overflow-y:auto;overscroll-behavior:contain}
.modal{width:100%;max-width:940px;background:var(--card-inner);border:1px solid var(--border-ctrl);border-radius:16px;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.9)}
.modal-head{position:relative;padding:34px 34px 26px;background-position:center;background-size:cover}
.modal-head-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,10,.62),rgba(11,13,14,.94))}
.modal-close{position:absolute;top:18px;right:18px;z-index:3;width:34px;height:34px;border-radius:8px;border:1px solid var(--border-hover);background:rgba(8,9,10,.7);display:grid;place-items:center;cursor:pointer;color:var(--sec);transition:border-color .16s ease,color .16s ease}
.modal-close:hover{border-color:var(--aqua);color:var(--aqua)}
.modal-close svg{width:15px;height:15px;fill:currentColor}
.modal-headin{position:relative;z-index:2}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
.modal-tags div{padding:4px 9px;border-radius:5px;border:1px solid var(--border-hover);background:rgba(8,9,10,.6);color:#c8cfd2}
.modal-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.02;letter-spacing:-1.4px;color:var(--white)}
.modal-meta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:12px;font-family:var(--f-mono);font-size:12px}
.modal-meta .org{color:var(--aqua)}
.modal-meta .dates{color:var(--dim)}
.modal-video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.modal-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-body{padding:30px 34px 34px;display:flex;flex-direction:column;gap:22px}
.modal-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.modal-role{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.2px;color:var(--ui)}
.modal-desc{margin:0;font-size:15.5px;line-height:1.65;color:var(--body);text-wrap:pretty}
.modal-ainote{margin:-4px 0 14px;padding:9px 13px;border:1px solid var(--aqua-line);border-left-width:2px;border-radius:6px;background:rgba(0,229,192,.05);font-size:13px;line-height:1.55;color:var(--dim)}
.modal-bullets{display:flex;flex-direction:column;gap:10px}
.bullet{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start}
.bullet-mark{font-family:var(--f-mono);font-size:12px;color:var(--aqua);line-height:1.7}
.bullet-text{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.bullet-text .ai-badge{flex:none}
.bullet-text span{flex:1 1 200px;font-size:14.5px;line-height:1.66;color:var(--sec);text-wrap:pretty}
.modal-links{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.modal-link{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:7px;border:1px solid #262b2e;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ui);transition:border-color .16s ease,color .16s ease}
.modal-link:hover{border-color:var(--aqua);color:var(--aqua)}

/* ---------- responsive: solo colapsa rejillas, no cambia el diseno base --- */
@media (max-width:900px){
  .hero-cols{grid-template-columns:minmax(0,1fr);gap:26px}
  .hero-side{border-left:0;border-top:1px solid var(--border);padding-left:0;padding-top:22px}
  .ai-block{grid-template-columns:minmax(0,1fr);gap:12px}
  .tl-row{grid-template-columns:24px minmax(0,1fr)}
  .tl-rail{grid-row:1 / span 2}
  .tl-dates{grid-column:2;text-align:left;padding:22px 0 0}
  .tl-body{grid-column:2;padding:4px 0 26px 18px}
  .nav{display:none}
}
@media (max-width:640px){
  .sec-inner,.hero-inner,.topbar-inner,.contact-inner{padding-left:20px;padding-right:20px}
  .sec-inner{padding-top:64px;padding-bottom:70px}
  .hero-inner{padding-top:72px;padding-bottom:60px}
  .hero h1{letter-spacing:-2px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .overlay{padding:76px 12px 28px}
  .modal-head,.modal-body{padding-left:20px;padding-right:20px}
  .ai-toggle{padding:4px 6px}
  .ai-toggle .ai-toggle-label{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand" role="button" tabindex="0">ARZPAL<span>.</span></div>
    <div class="topbar-right">
      <nav class="nav" id="nav"></nav>
      <div class="hairline"></div>
      <button class="ai-toggle" id="aiToggle" type="button">
        <span class="ai-toggle-label" id="aiToggleLabel"></span>
        <span class="switch"><span class="knob"></span></span>
      </button>
      <div class="langswitch" id="langSwitch">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </div>
</header>

<section class="hero" id="sec-hero">
  <div class="hero-grid"></div>
  <div class="hero-inner">
    <div class="eyebrow-row">
      <div class="eyebrow-dash"></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <h1>Andrés Ruiz Palomino</h1>
    <p class="hero-role" id="heroRole"></p>
    <div class="hero-cols">
      <p class="hero-p1" id="heroP1"></p>
      <div class="hero-side">
        <p class="hero-p3" id="heroP3"></p>
        <p class="hero-p2" id="heroP2"></p>
      </div>
    </div>
    <div class="ai-block">
      <div class="ai-block-label"><i></i><span id="aiLabel"></span></div>
      <p id="aiBody"></p>
    </div>
    <div class="pills" id="pills"></div>

/* ==========================================================================
   RENDER — de aqui para abajo no hace falta tocar nada para agregar contenido.
   ========================================================================== */

var SECTIONS = [
  { key: "projects", el: "sec-projects", label: "navProjects" },
  { key: "timeline", el: "sec-timeline", label: "navTimeline" },
  { key: "tools",    el: "sec-tools",    label: "navTools" },
  { key: "edu",      el: "sec-edu",      label: "navEdu" }
];

var state = { lang: "en", active: "projects", open: null, showAI: true };

try {
  var savedLang = localStorage.getItem("arzpal-lang");
  if (savedLang === "es" || savedLang === "en") state.lang = savedLang;
  if (localStorage.getItem("arzpal-showai") === "0") state.showAI = false;
} catch (e) {}

function $(id) { return document.getElementById(id); }

function pick(v) {
  if (v && typeof v === "object" && !Array.isArray(v)) return v[state.lang];
  return v;
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function firstSentence(s) {
  var m = String(s || "").match(/^[\s\S]*?[.!?](\s|$)/);
  return (m ? m[0] : String(s || "")).trim();
}

/* Un punto puede ser "texto" o { t: "texto", ai: true }. Los marcados con IA
   se OCULTAN cuando el toggle de la barra esta apagado. */
function bulletList(raw) {
  return (raw || [])
    .map(function (b) {
      return typeof b === "string" ? { text: b, ai: false } : { text: b.t, ai: !!b.ai };
    })
    .filter(function (b) { return b.ai ? state.showAI : true; });
}

/* cover (imagen propia) gana sobre el thumbnail de YouTube; image gana sobre
   maxresdefault en el fondo del modal. */
function thumbUrl(item) {
  if (item.cover) return item.cover;
  if (item.youtubeId) return "https://i.ytimg.com/vi/" + item.youtubeId + "/hqdefault.jpg";
  return null;
}
function bigUrl(item) {
  if (item.image) return item.image;
  if (item.youtubeId) return "https://i.ytimg.com/vi/" + item.youtubeId + "/maxresdefault.jpg";
  return null;
}
function cssUrl(u) { return "url(&#39;" + esc(u) + "&#39;)"; }

/* ---------- tarjeta (misma para proyectos y herramientas) ---------------- */
function cardHtml(item, group, index, opts) {
  var t = COPY[state.lang];
  var url = thumbUrl(item);
  var hasVideo = !!item.youtubeId;
  var tags = (pick(item.roleTags) || []).slice(0, 3);
  var aiBadge = !!item.ai && state.showAI;
  var h = '<button type="button" class="card" data-g="' + group + '" data-i="' + index + '">';

  h += '<div class="card-media">';
  h += '<div class="card-thumb" style="background-image:' + (url ? cssUrl(url) : "none") + '"></div>';
  if (!url) {
    h += '<div class="card-nomedia"><div>' + esc(item.nda ? t.noFootage : t.noFootageTool) + '</div></div>';
  } else {
    h += '<div class="card-scrim"></div>';
  }
  if (tags.length) {
    h += '<div class="card-tags">' + tags.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join("") + '</div>';
  }
  if (hasVideo) {
    h += '<div class="card-watch"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"></path></svg>' + esc(t.watch) + '</div>';
  }
  h += '</div>';

  h += '<div class="card-body">';
  h += '<div class="card-titlerow"><h3 class="card-title">' + esc(pick(item.title)) + '</h3>'
     + '<div class="card-dates">' + esc(pick(opts.dates)) + '</div></div>';
  h += '<div class="card-orgrow"><div class="card-org">' + esc(pick(opts.orgLine) || "—") + '</div>'
     + (aiBadge ? '<div class="ai-badge">' + esc(t.aiTag) + '</div>' : '') + '</div>';
  h += '<p class="card-short">' + esc(pick(opts.short)) + '</p>';
  h += '</div></button>';
  return h;
}

/* ---------- modal -------------------------------------------------------- */
function modalHtml() {
  var o = state.open;
  if (!o) return "";
  var isTool = o.g === "t";
  var p = isTool ? TOOLS[o.i] : PROJECTS[o.i];
  if (!p) return "";

  var t = COPY[state.lang];
  var labels = TAG_LABELS[state.lang];
  var big = bigUrl(p);
  var bg = big ? cssUrl(big) : "repeating-linear-gradient(135deg,#0b0d0e 0 10px,#101314 10px 20px)";
  var tags = (p.tags || []).map(function (tg) { return labels[tg] || tg; });
  var bullets = bulletList(pick(p.bullets));
  var links = p.links || [];
  var aiBadge = !!p.ai && state.showAI;

  var h = '<div class="overlay" id="overlay"><div class="modal">';

  h += '<div class="modal-head" style="background-image:' + bg + '">';
  h += '<div class="modal-head-scrim"></div>';
  h += '<button type="button" class="modal-close" id="modalClose" aria-label="Close">'
     + '<svg viewBox="0 0 24 24"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42Z"></path></svg></button>';
  h += '<div class="modal-headin">';
  if (tags.length) {
    h += '<div class="modal-tags">' + tags.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join("") + '</div>';
  }
  h += '<h3 class="modal-title">' + esc(pick(p.title)) + '</h3>';
  h += '<div class="modal-meta">'
     + '<div class="org">' + esc(pick(isTool ? p.kind : p.org) || "") + '</div>'
     + '<div class="dates">' + esc(pick(isTool ? p.meta : p.dates)) + '</div>'
     + (aiBadge ? '<div class="ai-badge">' + esc(t.aiTag) + '</div>' : '')
     + '</div>';
  h += '</div></div>';

  /* lite embed: el iframe solo existe cuando el modal esta abierto */
  if (p.youtubeId) {
    h += '<div class="modal-video"><iframe src="https://www.youtube-nocookie.com/embed/'
       + encodeURIComponent(p.youtubeId) + '?autoplay=1&amp;rel=0" title="Gameplay video" '
       + 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" '
       + 'allowfullscreen></iframe></div>';
  }

  h += '<div class="modal-body">';
  if (!isTool) {
    h += '<div><div class="modal-label">' + esc(t.myRole) + '</div>'
       + '<div class="modal-role">' + esc(pick(p.role) || "") + '</div></div>';
  }
  h += '<div><div class="modal-label">' + esc(t.about) + '</div>'
     + '<p class="modal-desc">' + esc(pick(isTool ? p.body : p.desc)) + '</p></div>';
  if (bullets.length) {
    h += '<div><div class="modal-label" style="margin-bottom:12px">' + esc(t.whatIBuilt) + '</div>';
    /* la nota solo aparece si hay algo marcado y el toggle esta encendido */
    if (bullets.some(function (b) { return b.ai; })) {
      h += '<div class="modal-ainote">' + esc(t.aiNote) + '</div>';
    }
    h += '<div class="modal-bullets">' + bullets.map(function (b) {
      return '<div class="bullet"><div class="bullet-mark">&#8250;</div><div class="bullet-text">'
        + (b.ai ? '<div class="ai-badge">' + esc(t.aiTag) + '</div>' : '')
        + '<span>' + esc(b.text) + '</span></div></div>';
    }).join("") + '</div></div>';
  }
  if (links.length) {
    h += '<div class="modal-links">' + links.map(function (l) {
      return '<a class="modal-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">'
        + esc(pick(l.label)) + ' &#8599;</a>';
    }).join("") + '</div>';
  }
  h += '</div></div></div>';
  return h;
}

/* ---------- render completo ---------------------------------------------- */
function render() {
  var t = COPY[state.lang];
  document.documentElement.lang = state.lang;

  $("nav").innerHTML = SECTIONS.map(function (s) {
    return '<button type="button" data-key="' + s.key + '"'
      + (state.active === s.key ? ' class="is-active"' : '') + '>' + esc(t[s.label]) + '</button>';
  }).join("");

  $("aiToggleLabel").textContent = t.aiToggle;
  $("aiToggle").className = "ai-toggle" + (state.showAI ? " is-on" : "");
  Array.prototype.forEach.call($("langSwitch").children, function (b) {
    b.className = b.getAttribute("data-lang") === state.lang ? "is-active" : "";
  });

  $("eyebrow").textContent = t.eyebrow;
  $("heroRole").textContent = t.role;
  $("heroP1").textContent = t.p1;
  $("heroP3").textContent = t.p3;
  $("heroP2").textContent = t.p2;
  $("aiLabel").textContent = t.aiLabel;
  $("aiBody").textContent = t.aiBody;
  $("ctaEmail").textContent = t.ctaEmail;
  $("ctaCv").textContent = t.ctaCv;
  $("pills").innerHTML = (t.pills || []).map(function (p) { return '<div>' + esc(p) + '</div>'; }).join("");

  $("secProjects").textContent = t.secProjects;
  $("projectsNote").textContent = t.projectsNote;
  $("clickHint").textContent = t.clickHint;
  $("projectsGrid").innerHTML = PROJECTS.map(function (p, i) {
    return cardHtml(p, "p", i, { dates: p.dates, orgLine: p.org, short: p.short });
  }).join("");

  $("secTimeline").textContent = t.secTimeline;
  $("timelineNote").textContent = t.timelineNote;
  $("timelineList").innerHTML = TIMELINE.map(function (e) {
    return '<div class="tl-row">'
      + '<div class="tl-dates">' + esc(pick(e.dates)) + '</div>'
      + '<div class="tl-rail"><i></i><div class="tl-dot' + (e.current ? ' is-current' : '') + '"></div></div>'
      + '<div class="tl-body">'
      + '<div class="tl-titlerow"><h3 class="tl-org">' + esc(pick(e.org)) + '</h3>'
      + '<div class="tl-kind">' + esc(pick(e.kind)) + '</div></div>'
      + '<div class="tl-role">' + esc(pick(e.role)) + '</div>'
      + '<p class="tl-line">' + esc(pick(e.line)) + '</p>'
      + '</div></div>';
  }).join("");

  $("secTools").textContent = t.secTools;
  $("toolsNote").textContent = t.toolsNote;
  $("toolsGrid").innerHTML = TOOLS.map(function (x, i) {
    return cardHtml(x, "t", i, { dates: x.meta, orgLine: x.kind, short: firstSentence(pick(x.body)) });
  }).join("");

  $("secEdu").textContent = t.secEdu;
  $("eduNote").textContent = t.eduNote;
  $("eduList").innerHTML = EDUCATION.map(function (e) {
    var h = '<div class="edu-card">';
    h += '<div class="edu-head"><h3 class="edu-school">' + esc(pick(e.school)) + '</h3>'
       + '<div class="edu-dates">' + esc(pick(e.dates)) + '</div></div>';
    h += '<div class="edu-program">' + esc(pick(e.program)) + '</div>';
    h += '<p class="edu-line">' + esc(pick(e.line)) + '</p>';
    if (e.note) {
      h += '<div class="edu-note"><svg viewBox="0 0 24 24"><path d="M12 3 1 8l11 5 9-4.09V15h2V8L12 3ZM5 13.18v2.94l7 3.82 7-3.82v-2.94l-7 3.82-7-3.82Z"></path></svg>'
         + esc(pick(e.note)) + '</div>';
    }
    return h + '</div>';
  }).join("");

  $("contactTitle").textContent = t.contactTitle;
  $("contactNote").textContent = t.contactNote;
  $("footerNote").textContent = t.footer;
  $("copyright").textContent = "© " + new Date().getFullYear() + " Andrés Ruiz Palomino";

  renderModal();
}

function renderModal() {
  $("modalRoot").innerHTML = modalHtml();
}

function setNavActive() {
  Array.prototype.forEach.call($("nav").children, function (b) {
    b.className = b.getAttribute("data-key") === state.active ? "is-active" : "";
  });
}

/* ---------- eventos ------------------------------------------------------ */
/* La nav hace scroll por JS y NO cambia la URL: nada de hashes. */
function scrollToKey(key) {
  var s = SECTIONS.filter(function (x) { return x.key === key; })[0];
  var el = s && $(s.el);
  if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: "smooth" });
}

function onScroll() {
  var probe = window.innerHeight * 0.3;
  var active = "";
  SECTIONS.forEach(function (s) {
    var el = $(s.el);
    if (el && el.getBoundingClientRect().top <= probe) active = s.key;
  });
  if (active !== state.active) { state.active = active; setNavActive(); }
}

$("nav").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-key]");
  if (b) scrollToKey(b.getAttribute("data-key"));
});

$("brand").addEventListener("click", function () {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("langSwitch").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-lang]");
  if (!b) return;
  state.lang = b.getAttribute("data-lang");
  try { localStorage.setItem("arzpal-lang", state.lang); } catch (err) {}
  render();
});

$("aiToggle").addEventListener("click", function () {
  state.showAI = !state.showAI;
  try { localStorage.setItem("arzpal-showai", state.showAI ? "1" : "0"); } catch (err) {}
  render();
});

document.addEventListener("click", function (e) {
  var card = e.target.closest(".card");
  if (card) {
    state.open = { g: card.getAttribute("data-g"), i: Number(card.getAttribute("data-i")) };
    renderModal();
    return;
  }
  if (e.target.closest("#modalClose")) { state.open = null; renderModal(); return; }
  /* clic en el backdrop cierra; dentro del panel no se propaga */
  if (e.target.id === "overlay") { state.open = null; renderModal(); }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && state.open) { state.open = null; renderModal(); }
});

window.addEventListener("scroll", onScroll, { passive: true });

render();
onScroll();
</script>
