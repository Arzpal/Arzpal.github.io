<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andrés Ruiz Palomino · Tools / Systems Programmer</title>
<meta name="description" content="Tools and systems programmer in Unity and C#. Gameplay systems, editor tooling and the feel layer on top of them.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* estructura: grafito calido */
  --ink-900:#100E0D; --ink-800:#171513; --ink-700:#1F1C1A; --ink-600:#2A2622; --ink-500:#3A342F;
  /* texto: calido, nunca blanco puro */
  --ink-000:#FFFCF8; --ink-100:#DDD6CF; --ink-200:#A79D95; --ink-300:#7A716A;
  /* senal del sistema */
  --signal:#FF9B45; --signal-hi:#FFB877; --signal-line:#4A2E18; --on-signal:#1A0F06;
  /* paleta de diagrama */
  --dg-active:var(--signal); --dg-data:#6FA8C7; --dg-warn:#C9A227; --dg-struct:#7A716A;
  --dg-canvas:#171513; --dg-grid:#252017; --dg-fill:#211D1A; --dg-fill-on:#231C14; --dg-line:#3A342F;
  /* carpinteria de UI por proyecto: L .74 C .12 fijas, solo cambia el matiz.
     La luminosidad fija es lo que garantiza el contraste (peor caso 6.93:1). */
  --a-unseasoned:oklch(.74 .12 25);  --a-crust:oklch(.74 .12 60);   --a-dco:oklch(.74 .12 95);
  --a-space:oklch(.74 .12 128);      --a-runies:oklch(.74 .12 145);  --a-hell:oklch(.74 .12 175);
  --a-casino:oklch(.74 .12 200);     --a-tatemis:oklch(.74 .12 230); --a-crazynema:oklch(.74 .12 265);
  --a-treasure:oklch(.74 .12 300);   --a-prismonaut:oklch(.74 .12 330); --a-photon:oklch(.74 .12 345);
  /* duotono del material: variante profunda del mismo matiz */
  --d-unseasoned:oklch(.46 .10 25);  --d-crust:oklch(.46 .10 60);   --d-dco:oklch(.46 .10 95);
  --d-space:oklch(.46 .10 128);      --d-runies:oklch(.46 .10 145);  --d-hell:oklch(.46 .10 175);
  --d-casino:oklch(.46 .10 200);     --d-tatemis:oklch(.46 .10 230); --d-crazynema:oklch(.46 .10 265);
  --d-treasure:oklch(.46 .10 300);   --d-prismonaut:oklch(.46 .10 330); --d-photon:oklch(.46 .10 345);
  /* cada tarjeta sobreescribe --acc y --dtone; por defecto van a la senal */
  --acc:var(--signal); --dtone:var(--ink-800);
  /* Intensidad del fondo. Subelas si en tu monitor no se nota, bajalas si distrae.
     Con .055 los glifos se pintan a rgb(22,19,18) sobre un fondo rgb(16,14,13). */
  --bg-glyph:.055; --bg-grid:.5;
  --f-display:'Bricolage Grotesque',sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'Martian Mono',ui-monospace,monospace;
  --rail:265px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink-900)}
body{color:var(--ink-100);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--signal);text-decoration:none}
a:hover{color:var(--signal-hi)}
::selection{background:var(--signal);color:var(--on-signal)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
h1,h2,h3{margin:0}

/* ---------- armazon: rail + contenido ------------------------------------ */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.main{flex:1;min-width:0}

.rail{position:sticky;top:0;flex:none;width:var(--rail);height:100vh;
  display:flex;flex-direction:column;border-right:1px solid var(--ink-600);background:var(--ink-900);z-index:60}
.rail-brand{padding:22px 20px 18px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;
  letter-spacing:1.4px;color:var(--ink-000);cursor:pointer;border-bottom:1px solid var(--ink-600)}
.rail-brand i{font-style:normal;color:var(--signal);margin-right:6px}
.tree{display:flex;flex-direction:column;padding:8px 0;flex:1;overflow-y:auto}
.tree button{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;align-items:center;gap:8px;
  width:100%;padding:11px 20px;cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:11.5px;
  letter-spacing:1.2px;color:var(--ink-200);border-left:2px solid transparent;transition:color .18s ease,background .18s ease}
.tree button:hover{color:var(--ink-000);background:var(--ink-800)}
.tree button.is-active{color:var(--signal);background:var(--ink-800);border-left-color:var(--signal)}
.tree .tw{color:var(--ink-300);font-size:9px}
.tree button.is-active .tw{color:var(--signal)}
.tree .tn{color:var(--ink-300)}
.tree .tc{color:var(--ink-300);font-size:10.5px}
.tree button.is-active .tn,.tree button.is-active .tc{color:var(--signal)}
.rail-foot{border-top:1px solid var(--ink-600);padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px}

.langswitch{display:inline-flex;border:1px solid var(--ink-600);border-radius:6px;overflow:hidden;
  font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:1px;align-self:flex-start}
.langswitch button{padding:5px 10px;cursor:pointer;color:var(--ink-200);transition:background .16s ease,color .16s ease}
.langswitch button:hover{color:var(--ink-000)}
.langswitch button.is-active{background:var(--signal);color:var(--on-signal)}

.upd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.upd span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:1.2px;color:var(--ink-300);line-height:1.5}
.upd b{font-weight:500;font-size:12px;color:var(--ink-200)}

/* barra superior: solo por debajo de 1080px */
.railbar{display:none;position:sticky;top:0;z-index:70;background:rgba(16,14,13,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ink-600)}
.railbar-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px}
.burger{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--ink-600);
  border-radius:6px;cursor:pointer;color:var(--ink-100)}
.burger svg{width:16px;height:16px;fill:currentColor}
/* display no se puede animar. La altura la mide el JS con scrollHeight, asi
   que no hay numero magico que se quede corto si crece el menu. */
.drawer{max-height:0;opacity:0;overflow:hidden;
  transition:max-height .3s cubic-bezier(.33,1,.68,1),opacity .24s ease}
.drawer.is-open{opacity:1}
.drawer-in{border-top:1px solid var(--ink-600);background:var(--ink-900)}
.burger .b-close{display:none}
.railbar.menu-open .burger .b-open{display:none}
.railbar.menu-open .burger .b-close{display:block}
.railbar.menu-open .burger{border-color:var(--signal);color:var(--signal)}

/* ---------- secciones ---------------------------------------------------- */
.sec{border-bottom:1px solid var(--ink-600)}
.sec-alt{background:var(--ink-800)}
.wrap{max-width:1240px;margin:0 auto;padding:88px 36px 96px}

.sec-num{font-family:var(--f-mono);font-size:12px;letter-spacing:1.4px;color:var(--signal)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4vw,46px);line-height:1;
  letter-spacing:-1.6px;text-transform:uppercase;color:var(--ink-000)}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.sec-note{margin:0;max-width:60ch;font-size:17px;line-height:1.6;color:var(--ink-200);text-wrap:pretty}

/* ---------- hero --------------------------------------------------------- */
.hero{border-bottom:1px solid var(--ink-600)}
.hero-in{max-width:1240px;margin:0 auto;padding:96px 36px 76px}
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:26px;font-family:var(--f-mono);
  font-size:11.5px;letter-spacing:2.2px;color:var(--signal)}
.eyebrow i{display:block;width:42px;height:2px;background:var(--signal);flex:none}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,8vw,104px);line-height:.9;
  letter-spacing:-3px;color:var(--ink-000);max-width:14ch;margin-bottom:26px}
.claim{margin:0 0 46px;max-width:44ch;font-family:var(--f-display);font-weight:500;
  font-size:clamp(20px,2vw,27px);line-height:1.28;letter-spacing:-.6px;color:var(--ink-100);text-wrap:pretty}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;
  border-top:1px solid var(--ink-600);padding-top:28px;margin-bottom:40px}
.pillar svg{width:20px;height:20px;fill:none;stroke:var(--signal);stroke-width:1.6;margin-bottom:12px}
.pillar h3{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1.6px;
  color:var(--ink-000);margin-bottom:8px}
.pillar p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-200);text-wrap:pretty}
.diff{border-left:2px solid var(--signal);padding:2px 0 2px 18px;margin-bottom:34px;max-width:64ch}
.diff b{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.3px;
  color:var(--ink-000);margin-bottom:6px}
.diff p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-200);text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.9px}
.chips div{padding:7px 11px;border:1px solid var(--ink-600);border-radius:3px;color:var(--ink-200)}
.chips div.hot{border-color:var(--signal-line);color:var(--signal)}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;
  border:1px solid var(--ink-600);font-family:var(--f-mono);font-size:11.5px;font-weight:600;
  letter-spacing:1.1px;color:var(--ink-000);cursor:pointer;transition:border-color .18s ease,color .18s ease}
.btn:hover{border-color:var(--signal);color:var(--signal)}
.btn-primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn-primary:hover{background:var(--signal-hi);border-color:var(--signal-hi);color:var(--on-signal)}
.btn-flat{border-color:var(--signal-line);color:var(--signal);cursor:default}
.btn-flat:hover{border-color:var(--signal-line);color:var(--signal)}

/* ---------- barra de control de IA --------------------------------------- */
.aibar{border-top:1px solid var(--ink-600);border-bottom:1px solid var(--ink-600);
  margin:26px 0 30px;padding:14px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.aitog{display:flex;align-items:center;gap:11px;cursor:pointer;font-family:var(--f-mono);
  font-size:11px;font-weight:600;letter-spacing:1.3px;color:var(--ink-300);
  transition:color .18s ease;min-height:44px}
.aitog.is-on{color:var(--ink-000)}
.switch{position:relative;width:38px;height:20px;border-radius:99px;flex:none;
  border:1px solid var(--ink-500);background:var(--ink-800);transition:background .2s ease,border-color .2s ease}
.aitog.is-on .switch{border-color:var(--signal-line);background:rgba(255,155,69,.14)}
.knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;background:var(--ink-300);
  transition:left .2s cubic-bezier(.4,.1,.2,1),background .2s ease}
.aitog.is-on .knob{left:20px;background:var(--signal)}
.aihelp{width:20px;height:20px;flex:none;border-radius:99px;border:1px solid var(--ink-600);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:9px;color:var(--ink-300);cursor:help}
.aiexp{flex:1 1 320px;min-width:0;font-size:15px;line-height:1.5;color:var(--ink-200);text-wrap:pretty}
.aicount{width:100%;font-family:var(--f-mono);font-size:10px;letter-spacing:1.2px;color:var(--ink-300)}
@media (max-width:760px){ .aiexp{display:none} }

/* ---------- tarjetas ----------------------------------------------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.pcard{position:relative;display:flex;flex-direction:column;text-align:left;width:100%;
  background:var(--ink-700);border:1px solid var(--ink-600);border-radius:10px;overflow:hidden;cursor:pointer;
  transition:transform .2s cubic-bezier(.33,1,.68,1),box-shadow .2s ease,border-color .2s ease,opacity .22s ease}
.pcard:hover{transform:translateY(-8px) scale(1.015);border-color:transparent;z-index:2;
  box-shadow:0 0 0 2px var(--acc),0 26px 52px -20px rgba(0,0,0,.92);
  transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s ease,border-color .26s ease}
.pcard:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.pcard:hover .brk{opacity:1;transform:translate(0,0)}
.brk{position:absolute;width:14px;height:14px;z-index:5;opacity:0;
  transition:opacity .12s linear,transform .12s cubic-bezier(.16,.84,.44,1)}
.brk path{stroke:var(--acc);fill:none;stroke-width:1.6}
.brk-tl{top:8px;left:8px;transform:translate(4px,4px)}
.brk-tr{top:8px;right:8px;transform:translate(-4px,4px)}
.brk-bl{bottom:8px;left:8px;transform:translate(4px,-4px)}
.brk-br{bottom:8px;right:8px;transform:translate(-4px,-4px)}

.media{position:relative;aspect-ratio:16/9;background:var(--dtone);overflow:hidden;
  border-bottom:1px solid var(--ink-600);
  transition:border-bottom-color .2s ease,border-bottom-width .2s cubic-bezier(.33,1,.68,1),margin-bottom .2s linear}
.pcard:hover .media{border-bottom-width:2px;border-bottom-color:var(--acc);margin-bottom:-1px;
  transition:border-bottom-color .26s ease,border-bottom-width .26s cubic-bezier(.34,1.56,.64,1),margin-bottom .26s linear}
.lum{position:absolute;inset:0;background-size:cover;background-position:center;
  mix-blend-mode:luminosity;transition:filter .22s ease}
.pcard:hover .lum{filter:saturate(1.3) brightness(1.14)}
.duo{position:absolute;inset:0;background:var(--ink-900);opacity:.42;transition:opacity .22s ease}
.pcard:hover .duo{opacity:.24}
.dgm{position:absolute;inset:0;width:100%;height:100%;transition:transform .22s cubic-bezier(.16,.84,.44,1)}
.pcard:hover .dgm{transform:scale(1.025)}
.mbadge{position:absolute;z-index:3;top:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:1.4px;
  background:rgba(16,14,13,.92);border:1px solid var(--ink-600);padding:3px 7px;border-radius:3px;color:var(--ink-000)}
.mbadge.l{left:10px} .mbadge.r{right:10px;color:var(--acc);border-color:var(--signal-line);letter-spacing:1.2px}
.watch{position:absolute;z-index:3;bottom:10px;left:10px;display:flex;align-items:center;gap:7px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:1.4px;color:var(--ink-000);
  background:rgba(16,14,13,.92);border:1px solid var(--ink-500);padding:4px 9px;border-radius:3px}
.watch svg{width:10px;height:10px;fill:var(--acc)}

.cbody{display:flex;flex-direction:column;flex:1;padding:16px 18px 18px}
.cbody h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;
  letter-spacing:-.4px;color:var(--ink-000);margin-bottom:12px}
.prows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin-bottom:12px;align-items:baseline}
.prows dt{font-family:var(--f-mono);font-size:10px;letter-spacing:1.2px;color:var(--ink-300)}
.prows dd{margin:0;font-size:15px;line-height:1.4;color:var(--ink-100)}
.prows dd.acc{color:var(--acc)}
.cshort{margin:0 0 16px;font-size:15.5px;line-height:1.55;color:var(--ink-200);text-wrap:pretty}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.8px}
.rtags div{padding:4px 8px;border:1px solid var(--ink-600);border-radius:3px;color:var(--ink-200);text-transform:uppercase}
.inspect{display:none}

/* apagado suave de las hermanas, con retraso para que el transito no parpadee */
.grid:hover .pcard:not(:hover){opacity:.78;
  transition:transform .2s cubic-bezier(.33,1,.68,1),box-shadow .2s ease,border-color .2s ease,opacity .22s ease .12s}

/* ---------- timeline ----------------------------------------------------- */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:minmax(0,150px) 28px minmax(0,1fr);align-items:start}
.tl-dates{font-family:var(--f-mono);font-size:11px;line-height:1.5;color:var(--ink-300);
  letter-spacing:.4px;padding:26px 18px 26px 0;text-align:right}
.tl-rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.tl-rail i{width:1px;background:var(--ink-600);height:100%}
.tl-dot{position:absolute;top:32px;width:9px;height:9px;border-radius:99px;background:var(--ink-500);
  box-shadow:0 0 0 4px var(--ink-900)}
.tl-dot.is-current{background:var(--signal)}
.tl-body{padding:26px 0 26px 22px;border-bottom:1px solid var(--ink-600)}
.tl-row:last-child .tl-body{border-bottom:0}
.tl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.tl-h h3{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.5px;color:var(--ink-000)}
.tl-kind{font-family:var(--f-mono);font-size:10px;letter-spacing:1.3px;color:var(--ink-300)}
.tl-cur{font-family:var(--f-mono);font-size:10px;letter-spacing:1.3px;color:var(--signal)}
.tl-role{font-family:var(--f-mono);font-size:12px;line-height:1.5;color:var(--signal);margin-bottom:9px}
.tl-line{margin:0;max-width:72ch;font-size:17px;line-height:1.6;color:var(--ink-100);text-wrap:pretty}

/* ---------- educacion ---------------------------------------------------- */
.edu{display:flex;flex-direction:column;gap:16px;max-width:900px}
.edu-card{border:1px solid var(--ink-600);border-left:2px solid var(--signal);border-radius:10px;
  background:var(--ink-700);padding:24px 28px}
.edu-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.edu-h h3{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.4px;color:var(--ink-000)}
.edu-dates{font-family:var(--f-mono);font-size:11px;letter-spacing:.6px;color:var(--ink-300)}
.edu-prog{font-family:var(--f-mono);font-size:12px;color:var(--signal);margin:8px 0 10px}
.edu-line{margin:0;font-size:17px;line-height:1.6;color:var(--ink-100);text-wrap:pretty}
.edu-note{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 13px;
  border:1px solid var(--signal-line);border-radius:6px;background:rgba(255,155,69,.05);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.6px;color:var(--signal)}
.edu-note svg{width:13px;height:13px;fill:currentColor;flex:none}

/* ---------- banda de IA + cierre ----------------------------------------- */
.band{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:34px;
  max-width:1240px;margin:0 auto;padding:64px 36px}
.band-l i{display:block;width:34px;height:2px;background:var(--signal);margin-bottom:12px}
.band-l h3{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1.6px;
  color:var(--signal);margin-bottom:10px}
.band-l p{margin:0;font-family:var(--f-mono);font-size:10.5px;line-height:1.7;color:var(--ink-300)}
.band-r{margin:0;font-size:17px;line-height:1.65;color:var(--ink-100);max-width:70ch;text-wrap:pretty}

.mail{display:inline-block;margin:22px 0 30px;font-family:var(--f-mono);font-weight:500;
  font-size:clamp(19px,3.2vw,34px);letter-spacing:-.8px;color:var(--ink-000);
  border-bottom:2px solid var(--signal);padding-bottom:6px;word-break:break-all}
.mail:hover{color:var(--signal)}
.foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--ink-600);display:flex;
  flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:baseline;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.6px;color:var(--ink-300)}
.foot b{font-weight:500;color:var(--ink-100)}

/* ---------- inspector ---------------------------------------------------- */
/* Capa de atenuacion, no un tapon: se sigue viendo la pagina detras, teñida
   con el color de la tarjeta que se abrio. */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;
  padding:52px 40px;overflow-y:auto;overscroll-behavior:contain;
  /* Dos capas del propio elemento, no un pseudo: el fondo de un contenedor con
     scroll no se mueve con su contenido, un hijo posicionado si. */
  background-color:rgba(10,9,8,.58);
  /* el color-mix va aqui, no en una variable de :root: una variable declarada
     arriba resuelve su var(--acc) alli y hereda ya resuelta, siempre en ambar */
  background-image:linear-gradient(
    color-mix(in srgb,var(--acc) 16%,transparent),
    color-mix(in srgb,var(--acc) 16%,transparent));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:ovIn .22s ease both}
.overlay.is-out{animation:ovOut .2s ease both;pointer-events:none}
.panel{position:relative;z-index:1;width:100%;max-width:940px;background:var(--ink-800);
  border:1px solid var(--ink-500);border-radius:14px;overflow:hidden;box-shadow:0 50px 110px -40px #000;
  animation:paIn .34s cubic-bezier(.34,1.56,.64,1) both}
.overlay.is-out .panel{animation:paOut .2s cubic-bezier(.33,1,.68,1) both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes ovOut{from{opacity:1}to{opacity:0}}
@keyframes paIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
@keyframes paOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.965) translateY(6px)}}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);z-index:4}

.irows{display:flex;flex-direction:column;padding-bottom:26px}

.irow dd.acc{color:var(--acc)}

  border-bottom:1px solid var(--ink-600);overflow:hidden}
/* las tarjetas sin video conservan su diagrama en el sitio del video */
.idgm{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--dg-canvas);
  background-image:radial-gradient(var(--dg-grid) 1px,transparent 1px);background-size:16px 16px;
  border-top:1px solid var(--ink-600);border-bottom:1px solid var(--ink-600)}
.idgm .dgm{position:absolute;inset:0;width:100%;height:100%}
.ivideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.iposter{position:absolute;inset:0;background-size:cover;background-position:center;cursor:pointer}
.iplay{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;border:0}
.iplay i{display:grid;place-items:center;width:74px;height:74px;border-radius:99px;background:var(--acc);
  box-shadow:0 18px 44px -14px #000;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.iplay:hover i{transform:scale(1.08)}
.iplay svg{width:26px;height:26px;fill:var(--on-signal);margin-left:4px}
.ihint{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:1.2px;color:var(--ink-200);background:rgba(16,14,13,.86);
  border-top:1px solid var(--ink-600);pointer-events:none}
.ibody{padding:30px 34px 34px;display:flex;flex-direction:column;gap:24px}
.ilabel{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:2px;color:var(--ink-300);margin-bottom:10px}
.ilabel i{display:block;flex:1;height:1px;background:var(--ink-600)}
.idesc{margin:0;font-size:17px;line-height:1.65;color:var(--ink-100);text-wrap:pretty}
.inote{margin:0 0 16px;padding:10px 14px;border:1px solid var(--signal-line);border-left-width:2px;
  border-radius:6px;background:rgba(255,155,69,.05);font-size:15px;line-height:1.55;color:var(--ink-200)}
.ibul{display:flex;flex-direction:column;gap:14px}
.bul{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.bul-m{font-family:var(--f-mono);font-size:12px;color:var(--acc);line-height:1.7}

.bul-t span{flex:1 1 220px;font-size:16.5px;line-height:1.7;color:var(--ink-100);text-wrap:pretty}
.bul-t .ia{flex:none;padding:2px 7px;border-radius:3px;border:1px solid var(--signal-line);
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:1.2px;color:var(--acc)}
.ilinks{display:flex;flex-wrap:wrap;gap:10px;padding-top:2px}

/* ---------- fondo vivo ---------------------------------------------------- */
/* Nada de iconos decorativos: los glifos son el mismo vocabulario del sitio
   (corchetes de seleccion, nodo con puertos, gizmo, hexagono, bezier, matriz).
   Solo se anima transform, asi que no hay repintado. */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.shell,.railbar{position:relative;z-index:1}
#bgGrid{position:absolute;inset:-60px;opacity:var(--bg-grid);
  background-image:radial-gradient(var(--dg-grid) 1px,transparent 1px);background-size:34px 34px;
  animation:gridDrift 140s linear infinite}
@keyframes gridDrift{to{transform:translate(34px,34px)}}
/* Sin will-change: el navegador promociona solo los transform animados, y 20
   capas forzadas gastan VRAM de mas. El recorrido es de 80-130px en 45-75s:
   se nota si lo miras, no distrae si no. */
.bgi{position:absolute;color:var(--ink-300);opacity:var(--bg-glyph)}

/* Con el inspector abierto no tiene sentido animar lo que esta detras del
   desenfoque: obliga a recomputar el backdrop-filter a pantalla completa en
   cada frame. Pausarlas es lo que devuelve la fluidez. */
html.modal-open #bgGrid,
html.modal-open .bgi{animation-play-state:paused}

/* ---------- reveal al scroll --------------------------------------------- */
.rv{opacity:0;transform:translateY(14px)}
.rv.in{opacity:1;transform:none;transition:opacity .38s cubic-bezier(.16,.84,.44,1),transform .38s cubic-bezier(.16,.84,.44,1)}

/* ---------- responsive --------------------------------------------------- */
@media (max-width:1279px){ :root{--rail:224px} }
@media (max-width:1079px){
  :root{--rail:0px}
  .shell{display:block}
  .rail{display:none}
  .railbar{display:block}
  .pcard{border-color:var(--ink-500);box-shadow:0 12px 28px -16px rgba(0,0,0,.9)}
  .pcard .media{border-bottom-width:2px;border-bottom-color:color-mix(in oklab,var(--acc) 38%,transparent)}
  .pcard:active{transform:scale(.985);transition:transform .26s cubic-bezier(.34,1.56,.64,1)}
  .grid:hover .pcard:not(:hover){opacity:1}
  .inspect{display:flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--f-mono);
    font-size:10.5px;letter-spacing:1.2px;color:var(--acc)}

}
@media (max-width:900px){
  .pillars{grid-template-columns:minmax(0,1fr);gap:26px}
  .band{grid-template-columns:minmax(0,1fr);gap:16px}
  .tl-row{grid-template-columns:22px minmax(0,1fr)}

  .tl-dates{grid-column:2;text-align:left;padding:22px 0 0}
  .tl-body{grid-column:2;padding:4px 0 24px 18px}
}
@media (max-width:640px){
  .wrap,.hero-in,.band{padding-left:20px;padding-right:20px}
  .wrap{padding-top:60px;padding-bottom:66px}
  .hero-in{padding-top:56px;padding-bottom:52px}

  .ihead,.ibody{padding-left:20px;padding-right:20px}

  .irow{grid-template-columns:minmax(0,1fr);gap:3px}
  .iplay i{width:58px;height:58px}
  .iplay svg{width:20px;height:20px}
}
@media (max-width:480px){ .overlay{padding:10px} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .pcard:hover,.pcard:active{transform:none}
  .pcard:hover .dgm{transform:none}
  .rv{opacity:1;transform:none}
  #bgGrid,.bgi{animation:none}
  .overlay,.panel,.overlay.is-out,.overlay.is-out .panel{animation-duration:.01ms}
}

    desc: {
      en: "A cook arrives in an unnamed city whose people forgot how to enjoy the moment. Each diner talks to you, you deduce from that conversation what they need to feel, translate it into a flavour profile, pick the dish and cook it. The structure is Papers, Please (a counter, a fixed camera, one case at a time) with its morality inverted: the same loop makes you an accomplice to a reconciliation instead of to cruelty. Built for the Takernal Game Jam 2026 on the theme \"unity through food\", by a team of five in nine days. I was the only programmer.",
      es: "Un cocinero llega a una ciudad sin nombre cuya gente olvidó disfrutar el momento. Cada comensal conversa contigo, de esa conversación deduces qué necesita sentir, lo traduces a un perfil de sabores, eliges el plato y lo cocinas. La estructura es Papers, Please (un mostrador, cámara fija, un caso a la vez) con su moral invertida: el mismo bucle te vuelve cómplice de una reconciliación en vez de una crueldad. Hecho para la Takernal Game Jam 2026 sobre el tema \"la comida que nos une\", por un equipo de cinco en nueve días. Fui el único programador."

    bullets: {
      en: [
        "Co-directed the project and designed the game: the inverted Papers, Please structure, cooking as a ritual that cannot fail, and no timer, no quota and no money, so the only tension in the game is understanding the person in front of you. The dishes are real fusion cuisine, which is how the theme lives inside the recipes rather than on top of them.",
        "Spent two days moving the game out of IMGUI to sprites and Canvas, measured the result, and threw the branch away. The kitchen felt worse, because there the gesture places the props and not the layout, so the artists could not move anything either way. I wrote the conclusion down in the repository so nobody on the team would spend the same two days again.",
        { t: "Sole programmer on a team of five: the cooking loop with nine gesture-driven preparation steps as interchangeable handlers, the dialogue and deduction system, and the recipe book. Dishes, clients and ingredients are ScriptableObjects, so the other four could author content on day two without waiting for me.", ai: true },
        { t: "Integrated FMOD and verified it end to end in WebGL, which was the project's largest technical risk. The WebGL banks come from FMOD Studio's Desktop platform, not from an HTML5 one, and finding that out is most of the job.", ai: true },
        { t: "Build tooling that applies the delivery settings by itself before every build. Without it the jam entry would have shipped as an executable named 2D_URP and with no decompression fallback.", ai: true }
      ],
      es: [

function bigUrl(item) {
  if (item.image) return item.image;
  if (item.youtubeId) return "https://i.ytimg.com/vi/" + item.youtubeId + "/maxresdefault.jpg";
  return null;
}

function cssUrl(u) { return "url(&#39;" + esc(u) + "&#39;)"; }

function accVars(item) {
  var a = item.acc || "signal";
  return "--acc:var(--a-" + a + ");--dtone:var(--d-" + a + ")";
}

const BRACKETS =
  '<svg class="brk brk-tl" viewBox="0 0 14 14"><path d="M1 5V1h4"></path></svg>' +
  '<svg class="brk brk-tr" viewBox="0 0 14 14"><path d="M9 1h4v4"></path></svg>' +
  '<svg class="brk brk-bl" viewBox="0 0 14 14"><path d="M1 9v4h4"></path></svg>' +
  '<svg class="brk brk-br" viewBox="0 0 14 14"><path d="M13 9v4H9"></path></svg>';

/* ---------- tarjeta (misma para proyectos y herramientas) ----------------- */
function cardHtml(item, group, index, opts) {
  var t = COPY[state.lang];
  var url = thumbUrl(item);
  var diag = item.diag ? DIAGRAMS[item.diag] : null;
  var aiBadge = !!item.ai && state.showAI;
  var tags = (pick(item.roleTags) || []).slice(0, 3);

  var h = '<button type="button" class="pcard" style="' + accVars(item) + '"'
        + ' data-g="' + group + '" data-i="' + index + '">' + BRACKETS;

  h += '<div class="media' + (diag ? " dg" : "") + '">';
  if (diag) {
    h += diag;
  } else if (url) {
    h += '<div class="lum" style="background-image:' + cssUrl(url) + '"></div>';
    h += '<div class="duo"></div>';
  }
  h += '<div class="mbadge l">' + esc(opts.type) + '</div>';
  if (aiBadge) h += '<div class="mbadge r">' + esc(t.aiTag) + '</div>';
  if (item.youtubeId) {
    h += '<div class="watch"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"></path></svg>' + esc(t.watch) + '</div>';
  }
  h += '</div>';

  h += '<div class="cbody"><h3>' + esc(pick(item.title)) + '</h3>';
  h += '<dl class="prows">';
  h += '<dt>' + esc(opts.l1) + '</dt><dd class="acc">' + esc(pick(opts.v1) || "—") + '</dd>';
  h += '<dt>' + esc(opts.l2) + '</dt><dd>' + esc(pick(opts.v2)) + '</dd>';
  h += '</dl>';
  h += '<p class="cshort">' + esc(pick(opts.short)) + '</p>';
  h += '<div class="rtags">';
  h += tags.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join("");
  h += '<span class="inspect">' + esc(t.inspect) + ' &#9656;</span>';
  h += '</div></div></button>';
  return h;
}

/* ---------- inspector ----------------------------------------------------- */
/* Se arma en tres piezas a proposito: cabecera, video y cuerpo. Cambiar de
   idioma o mover el toggle de IA reescribe cabecera y cuerpo pero nunca toca
   el nodo del video, asi que lo que este sonando sigue sonando. */

function modalCtx() {
  var o = state.open;
  if (!o) return null;
  var isTool = o.g === "t";
  var p = isTool ? TOOLS[o.i] : PROJECTS[o.i];
  if (!p) return null;
  return { isTool: isTool, p: p, t: COPY[state.lang], labels: TAG_LABELS[state.lang] };
}

function modalKey() { return state.open ? state.open.g + ":" + state.open.i : ""; }

function rowsFor(c) {
  var p = c.p, t = c.t, r = [];
  if (c.isTool) {
    /* Las herramientas tienen otro modelo: kind y meta en vez de org y dates. */
    r.push([t.rType, pick(p.kind), true]);
    r.push([t.rSource, pick(p.meta), false]);
    var rt = pick(p.roleTags) || [];
    if (rt.length) r.push([t.rRole, rt.join(" · "), false]);
  } else {
    r.push([t.rOrg, pick(p.org), true]);
    r.push([t.rDates, pick(p.dates), false]);
    if (p.role) r.push([t.rRole, pick(p.role), false]);
    if (p.stack) r.push([t.rStack, pick(p.stack), false]);
    if (p.team) r.push([t.rTeam, pick(p.team), false]);
  }
  return r.filter(function (x) { return x[1]; });
}

function modalHeadHtml(c) {
  var p = c.p, t = c.t;
  var tags = (p.tags || []).map(function (tg) { return c.labels[tg] || tg; });
  var h = '<div class="ibadges">';
  h += '<div>' + esc(c.isTool ? toolType(p) : t.tProject) + '</div>';
  h += tags.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join("");
  if (p.nda) h += '<div class="hot">NDA</div>';
  if (p.ai && state.showAI) h += '<div class="hot">' + esc(t.aiTag) + '</div>';
  h += '</div>';
  h += '<h2>' + esc(pick(p.title)) + '</h2>';
  h += '<dl class="irows">' + rowsFor(c).map(function (r) {
    return '<div class="irow"><dt>' + esc(r[0]) + '</dt><dd' + (r[2] ? ' class="acc"' : '') + '>' + esc(r[1]) + '</dd></div>';
  }).join("") + '</dl>';
  return h;
}

function modalBodyHtml(c) {
  var p = c.p, t = c.t;
  var bullets = bulletList(pick(p.bullets));
  var links = p.links || [];
  var h = "";
  h += '<div><div class="ilabel">' + esc(c.isTool ? t.whatItDoes : t.about) + '<i></i></div>'
     + '<p class="idesc">' + esc(pick(c.isTool ? p.body : p.desc)) + '</p></div>';
  if (bullets.length) {
    h += '<div><div class="ilabel">' + esc(t.whatIBuilt) + '<i></i></div>';
    /* la nota sale una sola vez, y solo si queda algo marcado a la vista */
    if (bullets.some(function (b) { return b.ai; })) h += '<div class="inote">' + esc(t.aiNote) + '</div>';
    h += '<div class="ibul">' + bullets.map(function (b) {
      return '<div class="bul"><div class="bul-m">&#8250;</div><div class="bul-t">'
        + (b.ai ? '<div class="ia">' + esc(t.aiTag) + '</div>' : '')
        + '<span>' + esc(b.text) + '</span></div></div>';
    }).join("") + '</div></div>';
  }
  if (links.length) {
    h += '<div class="ilinks">' + links.map(function (l) {
      return '<a class="btn" href="' + esc(l.url) + '" target="_blank" rel="noopener">'
        + esc(pick(l.label)) + ' &#8599;</a>';
    }).join("") + '</div>';
  }
  return h;
}

function modalHtml() {
  var c = modalCtx();
  if (!c) return "";
  var p = c.p, t = c.t;
  var big = bigUrl(p);

  var h = '<div class="overlay" id="overlay" style="' + accVars(p) + '"><div class="panel">';
  h += '<div class="iclose"><span>ESC</span><button type="button" id="modalClose" aria-label="Close">'
     + '<svg viewBox="0 0 24 24"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42Z"></path></svg></button></div>';
  h += '<div class="ihead" id="modalHead">' + modalHeadHtml(c) + '</div>';

  /* lite embed: el iframe no existe hasta que se hace clic en el poster.
     La imagen del inspector va A COLOR, sin duotono: el duotono existe para
     unificar la grilla y aqui hay una sola imagen. */
  if (p.youtubeId) {
    h += '<div class="ivideo" id="modalVideo">';
    if (state.playing) {
      h += '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(p.youtubeId)
         + '?autoplay=1&amp;rel=0" title="Gameplay video" allow="accelerometer; autoplay; clipboard-write; '
         + 'encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    } else {
      if (big) h += '<div class="iposter" style="background-image:' + cssUrl(big) + '"></div>';
      h += '<button type="button" class="iplay" id="modalPlay" aria-label="Play">'
         + '<i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"></path></svg></i></button>';
      h += '<div class="ihint">' + esc(t.playHint) + '</div>';
    }
    h += '</div>';
  } else if (p.diag && DIAGRAMS[p.diag]) {
    /* sin material audiovisual: el diagrama se queda, en el mismo sitio */
    h += '<div class="idgm">' + DIAGRAMS[p.diag] + '</div>';
  }

  h += '<div class="ibody" id="modalBody">' + modalBodyHtml(c) + '</div>';
  h += '</div></div>';
  return h;
}

/* ---------- barra de control de IA ---------------------------------------- */
function aiBarHtml(n) {
  var t = COPY[state.lang];
  return '<button type="button" class="aitog' + (state.showAI ? " is-on" : "") + '" id="aiTog">'
       + '<span class="switch"><span class="knob"></span></span>' + esc(t.aiToggle) + '</button>'
       + '<span class="aihelp" title="' + esc(t.aiHelp) + '">?</span>'
       + '<span class="aiexp">' + esc(t.aiHelp) + '</span>'
       + '<span class="aicount">' + esc(t.aiCount.replace("{n}", n)) + '</span>';
}

/* ---------- render completo ----------------------------------------------- */
function navHtml() {
  var t = COPY[state.lang];
  var counts = { projects: PROJECTS.length, timeline: TIMELINE.length, tools: TOOLS.length, edu: EDUCATION.length, contact: "" };
  return SECTIONS.map(function (s, i) {
    return '<button type="button" data-key="' + s.key + '"' + (state.active === s.key ? ' class="is-active"' : '') + '>'
      + '<span class="tw">&#9656;</span>'
      + '<span class="tn">' + ("0" + (i + 1)) + '</span>'
      + '<span>' + esc(t[s.label]) + '</span>'
      + '<span class="tc">' + counts[s.key] + '</span></button>';
  }).join("");
}

function render() {
  var t = COPY[state.lang];
  document.documentElement.lang = state.lang;

  $("nav").innerHTML = navHtml();
  $("navM").innerHTML = navHtml();
  [$("langSwitch"), $("langSwitchM")].forEach(function (sw) {
    Array.prototype.forEach.call(sw.children, function (b) {
      b.className = b.getAttribute("data-lang") === state.lang ? "is-active" : "";
    });
  });

  var fecha = lastUpdatedText(state.lang);
  [["updLabel", "updVal"], ["updLabelM", "updValM"], ["updLabelF", "updValF"]].forEach(function (p) {
    $(p[0]).textContent = t.updated;
    $(p[1]).textContent = fecha;
  });

  /* hero */
  $("eyebrow").textContent = t.eyebrow;
  $("claim").textContent = t.claim;
  $("pillars").innerHTML = t.pillars.map(function (p, i) {
    return '<div class="pillar">' + PILLAR_ICONS[i] + '<h3>' + esc(p[0]) + '</h3><p>' + esc(p[1]) + '</p></div>';
  }).join("");
  $("diffTitle").textContent = t.diffTitle;
  $("diffBody").innerHTML = esc(t.diffBody)
    + ' <a href="https://www.youtube.com/@arzpal" target="_blank" rel="noopener">youtube.com/@arzpal &#8599;</a>';
  $("chips").innerHTML = t.chips.map(function (c, i) {
    return '<div' + (i === t.chips.length - 1 ? ' class="hot"' : '') + '>' + esc(c) + '</div>';
  }).join("");
  $("ctaEmail").textContent = t.ctaEmail;
  $("ctaCv").textContent = t.ctaCv;
  $("ctaCv2").textContent = t.ctaCv;
  $("openToWork").textContent = t.openToWork;

  /* 01 proyectos */
  $("secProjects").textContent = t.secProjects;
  $("projectsNote").textContent = t.projectsNote;
  $("projectsGrid").innerHTML = PROJECTS.map(function (p, i) {
    return cardHtml(p, "p", i, { type: t.tProject, l1: t.rOrg, v1: p.org, l2: t.rDates, v2: p.dates, short: p.short });
  }).join("");

  /* 02 trayectoria */
  $("secTimeline").textContent = t.secTimeline;
  $("timelineNote").textContent = t.timelineNote;
  $("timelineList").innerHTML = TIMELINE.map(function (e) {
    return '<div class="tl-row"><div class="tl-dates">' + esc(pick(e.dates)) + '</div>'
      + '<div class="tl-rail"><i></i><div class="tl-dot' + (e.current ? ' is-current' : '') + '"></div></div>'
      + '<div class="tl-body"><div class="tl-h"><h3>' + esc(pick(e.org)) + '</h3>'
      + (e.current ? '<div class="tl-cur">' + esc(t.current) + '</div>' : '')
      + '<div class="tl-kind">' + esc(pick(e.kind)) + '</div></div>'
      + '<div class="tl-role">' + esc(pick(e.role)) + '</div>'
      + '<p class="tl-line">' + esc(pick(e.line)) + '</p></div></div>';
  }).join("");

  /* 03 herramientas */
  $("secTools").textContent = t.secTools;
  $("toolsNote").textContent = t.toolsNote;
  $("toolsGrid").innerHTML = TOOLS.map(function (x, i) {
    return cardHtml(x, "t", i, { type: toolType(x), l1: t.rType, v1: x.kind, l2: t.rSource, v2: x.meta, short: firstSentence(pick(x.body)) });
  }).join("");

  /* barras de IA: una en 01 y otra en 03 */
  var marcadosP = PROJECTS.filter(function (p) { return p.ai; }).length;
  Array.prototype.forEach.call(document.querySelectorAll("[data-aibar]"), function (bar, i) {
    bar.innerHTML = aiBarHtml(i === 0 ? PROJECTS.length : TOOLS.length);
  });

  /* 04 educacion */
  $("secEdu").textContent = t.secEdu;
  $("eduNote").textContent = t.eduNote;
  $("eduList").innerHTML = EDUCATION.map(function (e) {
    var h = '<div class="edu-card"><div class="edu-h"><h3>' + esc(pick(e.school)) + '</h3>'
          + '<div class="edu-dates">' + esc(pick(e.dates)) + '</div></div>'
          + '<div class="edu-prog">' + esc(pick(e.program)) + '</div>'
          + '<p class="edu-line">' + esc(pick(e.line)) + '</p>';
    if (e.note) {
      h += '<div class="edu-note"><svg viewBox="0 0 24 24"><path d="M12 3 1 8l11 5 9-4.09V15h2V8L12 3ZM5 13.18v2.94l7 3.82 7-3.82v-2.94l-7 3.82-7-3.82Z"></path></svg>'
         + esc(pick(e.note)) + '</div>';
    }
    return h + '</div>';
  }).join("");

  /* banda de IA y cierre */
  $("aiLabel").textContent = t.aiLabel;
  $("aiSub").textContent = t.aiSub;
  $("aiBody").textContent = t.aiBody;
  $("contactTitle").textContent = t.contactTitle;
  $("contactNote").textContent = t.contactNote;
  $("footNote").textContent = t.footer;

  revealInit();
  altoDrawer();

  /* Si el inspector ya esta abierto en la misma tarjeta solo se refresca el
     texto: reconstruirlo recrearia el iframe y reiniciaria el video. */
  if (state.open && modalShown === modalKey()) refreshModal();
  else renderModal();
}

/* Inyecta el iframe SOLO dentro del bloque de video. Reconstruir el modal
   entero repetiria la animacion de entrada del panel. */
function playVideo() {
  var c = modalCtx();
  var box = $("modalVideo");
  if (!c || !box || !c.p.youtubeId) return;
  state.playing = true;
  box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'
    + encodeURIComponent(c.p.youtubeId) + '?autoplay=1&amp;rel=0" title="Gameplay video" '
    + 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" '
    + 'allowfullscreen></iframe>';
}

/* Cierre en dos tiempos: primero la animacion de salida, y recien despues se
   saca del DOM. Si se vuelve a abrir algo mientras tanto, no se lo lleva. */
function closeModal() {
  var ov = $("overlay");
  state.open = null; state.playing = false; modalShown = "";
  document.body.style.overflow = "";
  if (!ov) { $("modalRoot").innerHTML = ""; return; }
  ov.classList.add("is-out");
  setTimeout(function () {
    if ($("modalRoot").firstChild === ov) $("modalRoot").innerHTML = "";
    /* el fondo se reanuda recien al final, para que la salida tampoco tironee */
    if (!state.open) document.documentElement.classList.remove("modal-open");
  }, 210);
}

function renderModal() {
  $("modalRoot").innerHTML = modalHtml();
  modalShown = modalKey();
  document.body.style.overflow = state.open ? "hidden" : "";
  if (state.open) document.documentElement.classList.add("modal-open");
}

function refreshModal() {
  var c = modalCtx();
  var head = $("modalHead");
  var body = $("modalBody");
  if (!c || !head || !body) { renderModal(); return; }
  head.innerHTML = modalHeadHtml(c);
  body.innerHTML = modalBodyHtml(c);
}

/* ---------- reveal al scroll ---------------------------------------------- */
var revealObs = null;
function revealInit() {
  if (!("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(document.querySelectorAll(".rv"), function (el) { el.classList.add("in"); });
    return;
  }
  if (!revealObs) {
    revealObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en, i) {
        if (!en.isIntersecting) return;
        var el = en.target;
        setTimeout(function () { el.classList.add("in"); }, i * 55);
        revealObs.unobserve(el);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".rv:not(.in)"), function (el) { revealObs.observe(el); });
}

/* ---------- navegacion ----------------------------------------------------- */
/* La nav hace scroll por JS y NO cambia la URL: nada de hashes. */
function scrollToKey(key) {
  var s = SECTIONS.filter(function (x) { return x.key === key; })[0];
  var el = s && $(s.el);
  if (!el) return;
  var off = window.innerWidth <= 1080 ? 70 : 0;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - off, behavior: "smooth" });
  closeDrawer();
}

function setNavActive() {
  [$("nav"), $("navM")].forEach(function (n) {
    Array.prototype.forEach.call(n.children, function (b) {
      b.className = b.getAttribute("data-key") === state.active ? "is-active" : "";
    });
  });
}

function onScroll() {
  var probe = window.innerHeight * 0.3;
  var active = "";
  SECTIONS.forEach(function (s) {
    var el = $(s.el);
    if (el && el.getBoundingClientRect().top <= probe) active = s.key;
  });
  if (active !== state.active) { state.active = active; setNavActive(); }
}

/* La altura de destino se mide, no se adivina: si manana hay una seccion mas,
   sigue funcionando sin tocar el CSS. */
function altoDrawer() {
  var d = $("drawer");
  d.style.maxHeight = d.classList.contains("is-open") ? d.querySelector(".drawer-in").scrollHeight + "px" : "0px";
}

function closeDrawer() {
  $("drawer").classList.remove("is-open");
  $("railbar").classList.remove("menu-open");
  $("burger").setAttribute("aria-expanded", "false");
  altoDrawer();
}

/* ---------- eventos -------------------------------------------------------- */
document.addEventListener("click", function (e) {
  var b;

  if ((b = e.target.closest("button[data-key]"))) { scrollToKey(b.getAttribute("data-key")); return; }

  if ((b = e.target.closest("button[data-lang]"))) {
    state.lang = b.getAttribute("data-lang");
    try { localStorage.setItem("arzpal-lang", state.lang); } catch (err) {}
    render();
    return;
  }

  if (e.target.closest("#aiTog")) {
    state.showAI = !state.showAI;
    try { localStorage.setItem("arzpal-showai", state.showAI ? "1" : "0"); } catch (err) {}
    render();
    return;
  }

  if (e.target.closest("#brand") || e.target.closest("#brandM")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    closeDrawer();
    return;
  }

  if (e.target.closest("#burger")) {
    var abierto = $("drawer").classList.toggle("is-open");
    $("railbar").classList.toggle("menu-open", abierto);
    $("burger").setAttribute("aria-expanded", abierto ? "true" : "false");
    altoDrawer();
    return;
  }

  /* el poster inyecta el iframe; el resto del modal no se toca */
  if (e.target.closest("#modalPlay")) { playVideo(); return; }

  if ((b = e.target.closest(".pcard"))) {
    state.open = { g: b.getAttribute("data-g"), i: Number(b.getAttribute("data-i")) };
    state.playing = false;
    renderModal();
    return;
  }

  if (e.target.closest("#modalClose")) { closeModal(); return; }
  if (e.target.id === "overlay") { closeModal(); }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (state.open) { closeModal(); }
    else closeDrawer();
  }
});

window.addEventListener("scroll", onScroll, { passive: true });

render();
onScroll();

</script>
</body>
</html>
